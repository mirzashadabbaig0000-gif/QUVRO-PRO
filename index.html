<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatVerse - Private Messenger</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;      /* Indigo - unique color */
            --primary-dark: #4338ca;
            --secondary: #10b981;     /* Emerald green */
            --bg-main: #f8fafc;
            --bg-dark: #0f172a;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --message-sent: #4f46e5;
            --message-received: #f1f5f9;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* Main Container - Unique Design */
        .app-container {
            max-width: 420px;
            width: 100%;
            height: 780px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar - Unique */
        .status-bar {
            background: var(--primary);
            padding: 15px 20px 10px;
            color: white;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
        }

        /* Header - Original Design */
        .main-header {
            background: var(--primary);
            padding: 10px 20px 20px;
            color: white;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 600;
        }

        .header-icons {
            display: flex;
            gap: 18px;
        }

        .header-icons i {
            font-size: 22px;
            opacity: 0.9;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .welcome-sub {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Tab Bar - Original */
        .tab-bar {
            background: white;
            margin: 20px;
            margin-top: 30px;
            display: flex;
            padding: 5px;
            border-radius: 15px;
            background: #f1f5f9;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-item.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Form Container */
        .form-section {
            flex: 1;
            padding: 0 20px 20px;
            overflow-y: auto;
        }

        /* Input Groups - Original Style */
        .input-field {
            margin-bottom: 20px;
        }

        .input-field label {
            display: block;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--text-light);
            font-size: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: white;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: var(--text-light);
        }

        /* Phone Input - Unique */
        .phone-wrapper {
            display: flex;
            gap: 10px;
        }

        .country-select {
            width: 100px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
        }

        /* Button - Original Design */
        .action-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Links */
        .link-group {
            text-align: center;
            margin: 15px 0;
        }

        .link-group a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin: 0 12px;
        }

        /* Divider */
        .divider-custom {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
            margin: 25px 0;
        }

        .divider-custom::before,
        .divider-custom::after {
            content: '';
            flex: 1;
            border-bottom: 1px dashed var(--border);
        }

        .divider-custom span {
            margin: 0 15px;
        }

        /* QR Section - Unique */
        .qr-section {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 25px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .qr-icon {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--primary);
        }

        .qr-text h4 {
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .qr-text p {
            color: var(--text-light);
            font-size: 13px;
        }

        /* Terms */
        .terms-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            margin: 20px 0;
        }

        .terms-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        /* Footer */
        .app-footer {
            background: white;
            padding: 15px;
            text-align: center;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-light);
        }

        .app-footer i {
            color: var(--secondary);
            margin: 0 3px;
        }

        /* Message Popup */
        .popup-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 50px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { top: -100px; }
            to { top: 20px; }
        }

        .popup-error {
            border-left: 4px solid #ef4444;
        }

        .popup-success {
            border-left: 4px solid var(--secondary);
        }

        /* Loading */
        .loading-spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app-container {
                height: 100vh;
                border-radius: 0;
            }
            
            .phone-wrapper {
                flex-direction: column;
            }
            
            .country-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Popup Message -->
    <div id="popup" class="popup-message">
        <i id="popupIcon" class="fas fa-info-circle"></i>
        <span id="popupText"></span>
    </div>

    <div class="app-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <span>
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </span>
        </div>

        <!-- Main Header -->
        <div class="main-header">
            <div class="header-top">
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <span class="logo-text">ChatVerse</span>
                </div>
                <div class="header-icons">
                    <i class="fas fa-camera"></i>
                    <i class="fas fa-search"></i>
                    <i class="fas fa-ellipsis-vertical"></i>
                </div>
            </div>
            <div class="welcome-text">
                Welcome back! 👋
            </div>
            <div class="welcome-sub">
                Connect with friends securely
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab-item active" id="loginTab" onclick="switchPanel('login')">Login</div>
            <div class="tab-item" id="registerTab" onclick="switchPanel('register')">Register</div>
        </div>

        <!-- Login Panel -->
        <div class="form-section" id="loginPanel">
            <div class="input-field">
                <label>Email or Phone</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="loginUser" placeholder="your@email.com" value="demo@chatverse.com">
                </div>
            </div>

            <div class="input-field">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="••••••••" value="123456">
                    <i class="fas fa-eye toggle-password" onclick="showPassword('loginPass', this)"></i>
                </div>
            </div>

            <div class="link-group">
                <a href="#" onclick="forgotPass()">Forgot password?</a>
                <a href="#" onclick="switchPanel('register')">Create account</a>
            </div>

            <button class="action-btn" onclick="processLogin()">
                <span>Login Now</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <div class="divider-custom">
                <span>OR</span>
            </div>

            <!-- QR Code Section -->
            <div class="qr-section">
                <div class="qr-icon">
                    <i class="fas fa-qrcode"></i>
                </div>
                <div class="qr-text">
                    <h4>Connect with QR</h4>
                    <p>Scan to login on desktop</p>
                </div>
            </div>
        </div>

        <!-- Register Panel (Hidden) -->
        <div class="form-section" id="registerPanel" style="display: none;">
            <div class="input-field">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="John Doe">
                </div>
            </div>

            <div class="input-field">
                <label>Phone Number</label>
                <div class="phone-wrapper">
                    <select class="country-select" id="countryCode">
                        <option value="+91">🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+92">🇵🇰 +92</option>
                    </select>
                    <div class="input-wrapper" style="flex:1;">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="regPhone" placeholder="98765 43210">
                    </div>
                </div>
            </div>

            <div class="input-field">
                <label>Email (Optional)</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="john@example.com">
                </div>
            </div>

            <div class="input-field">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPass" placeholder="Create password">
                    <i class="fas fa-eye toggle-password" onclick="showPassword('regPass', this)"></i>
                </div>
            </div>

            <div class="terms-text">
                By continuing, you agree to our 
                <a href="#">Terms of Service</a> and 
                <a href="#">Privacy Policy</a>
            </div>

            <button class="action-btn" onclick="processRegister()">
                <span>Create Account</span>
                <i class="fas fa-user-plus"></i>
            </button>

            <div class="link-group">
                <a href="#" onclick="switchPanel('login')">Already have account? Login</a>
            </div>
        </div>

        <!-- Footer -->
        <div class="app-footer">
            <p>
                <i class="fas fa-shield-alt"></i> 
                End-to-end encrypted • 
                <i class="fas fa-heart" style="color: #ef4444;"></i> 
                Made with privacy
            </p>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading-spinner"></div>

    <script>
        // Switch between Login and Register
        function switchPanel(panel) {
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            
            if(panel === 'login') {
                loginPanel.style.display = 'block';
                registerPanel.style.display = 'none';
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
            } else {
                loginPanel.style.display = 'none';
                registerPanel.style.display = 'block';
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
            }
        }

        // Toggle Password Visibility
        function showPassword(inputId, element) {
            const input = document.getElementById(inputId);
            if(input.type === 'password') {
                input.type = 'text';
                element.classList.remove('fa-eye');
                element.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                element.classList.remove('fa-eye-slash');
                element.classList.add('fa-eye');
            }
        }

        // Show Popup Message
        function showPopup(message, type) {
            const popup = document.getElementById('popup');
            const popupText = document.getElementById('popupText');
            const popupIcon = document.getElementById('popupIcon');
            
            popupText.innerText = message;
            
            if(type === 'error') {
                popup.className = 'popup-message popup-error';
                popupIcon.className = 'fas fa-exclamation-circle';
                popupIcon.style.color = '#ef4444';
            } else {
                popup.className = 'popup-message popup-success';
                popupIcon.className = 'fas fa-check-circle';
                popupIcon.style.color = '#10b981';
            }
            
            popup.style.display = 'flex';
            
            setTimeout(() => {
                popup.style.display = 'none';
            }, 3000);
        }

        // Process Login
        function processLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            
            if(!user || !pass) {
                showPopup('Please fill all fields!', 'error');
                return;
            }
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            
            // Simulate login
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                showPopup('Login successful! Redirecting...', 'success');
                
                // Redirect to chat page
                setTimeout(() => {
                    window.location.href = '#chat'; // Yahan apna chat page link karo
                }, 1000);
            }, 1500);
        }

        // Process Register
        function processRegister() {
            const name = document.getElementById('regName').value;
            const phone = document.getEl
