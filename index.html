<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO - Secure Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root { 
            --green: #075e54; 
            --light: #25d366; 
            --bg: #121b22; 
            --dark: #1f2c34;
            --darker: #0b141a;
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: white; 
            height: 100%; 
            overflow: hidden; 
        }
        
        /* Auth Screen */
        #authScreen { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: linear-gradient(135deg, #075e54 0%, #128C7E 100%);
        }
        
        .box { 
            width: 85%; 
            max-width: 350px; 
            text-align: center; 
            background: var(--dark); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .logo { 
            width: 70px; 
            height: 70px; 
            background: var(--green); 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 20px; 
            font-size: 40px; 
            font-weight: bold; 
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        h2 {
            margin-bottom: 20px;
            color: white;
        }
        
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 8px 0; 
            background: #2a3942; 
            border: none; 
            color: white; 
            border-radius: 10px; 
            box-sizing: border-box; 
            outline: none; 
            font-size: 16px;
        }
        
        input:focus {
            border: 2px solid var(--light);
        }
        
        button { 
            background: var(--light); 
            color: #000; 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer; 
            margin-top: 15px; 
            font-size: 16px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #20b859;
            transform: scale(1.02);
        }
        
        /* Dashboard */
        #chatDashboard, #chatRoom { 
            display: none; 
            height: 100vh; 
            flex-direction: column; 
            background: var(--bg);
        }
        
        .bar { 
            background: var(--dark); 
            padding: 15px; 
            font-weight: bold; 
            border-bottom: 1px solid #2a3942;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user { 
            padding: 15px; 
            border-bottom: 1px solid #2a3942; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .user:hover {
            background: #1f2c34;
        }
        
        .user-avatar {
            width: 45px;
            height: 45px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        
        #msgArea { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            background: var(--darker); 
            display: flex; 
            flex-direction: column; 
        }
        
        .message { 
            padding: 10px 15px; 
            border-radius: 10px; 
            margin-bottom: 8px; 
            max-width: 75%; 
            word-wrap: break-word;
            position: relative;
        }
        
        .message.sent { 
            background: #005c4b; 
            align-self: flex-end; 
            border-bottom-right-radius: 0;
        }
        
        .message.received { 
            background: #202c33; 
            align-self: flex-start; 
            border-bottom-left-radius: 0;
        }
        
        .message small {
            font-size: 10px;
            opacity: 0.7;
            margin-left: 10px;
        }
        
        .input-area {
            background: var(--dark);
            padding: 15px;
            display: flex;
            gap: 10px;
        }
        
        #mIn {
            flex: 1;
            margin: 0;
            padding: 12px 15px;
            border-radius: 25px;
        }
        
        #sendBtn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            padding: 0;
            font-size: 20px;
            margin: 0;
        }
        
        .back-btn {
            cursor: pointer;
            font-size: 24px;
            margin-right: 10px;
        }
        
        #with {
            font-weight: bold;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #8696a0;
        }
        
        .timestamp {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }
        
        .status-badge {
            background: var(--light);
            color: black;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<!-- Auth Screen -->
<div id="authScreen">
    <div class="box">
        <div class="logo">Q</div>
        <h2>QUVRO</h2>
        <input type="text" id="nameInput" placeholder="Your Name" required>
        <input type="email" id="emailInput" placeholder="Email" required>
        <input type="password" id="passwordInput" placeholder="Password" required>
        <button onclick="handleAuth()">CONTINUE →</button>
    </div>
</div>

<!-- Dashboard -->
<div id="chatDashboard">
    <div class="bar">
        <span>📱 QUVRO</span>
        <span style="margin-left:auto; font-size:14px;" id="userName"></span>
    </div>
    <div id="userList" style="flex:1; overflow-y:auto;"></div>
</div>

<!-- Chat Room -->
<div id="chatRoom">
    <div class="bar">
        <span class="back-btn" onclick="goToDashboard()">←</span>
        <span id="chatWith">Loading...</span>
    </div>
    <div id="messageArea"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        databaseURL: "https://quvro-b3923-default-rtdb.firebaseio.com",
        projectId: "quvro-b3923",
        storageBucket: "quvro-b3923.firebasestorage.app",
        messagingSenderId: "46528123402",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // Encryption Key
    const SECRET_KEY = "Quvro_Super_Secure_Key_2025";
    
    // Global Variables
    let currentChatUserId = null;
    let currentChatUserName = "";
    let unsubscribeMessages = null;
    
    // ==================== ENCRYPTION ====================
    function encryptMessage(text) {
        try {
            return CryptoJS.AES.encrypt(text, SECRET_KEY).toString();
        } catch(e) {
            console.error("Encryption error:", e);
            return text;
        }
    }
    
    function decryptMessage(encryptedText) {
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedText, SECRET_KEY);
            const decrypted = bytes.toString(CryptoJS.enc.Utf8);
            return decrypted || "🔒 Encrypted message";
        } catch(e) {
            console.error("Decryption error:", e);
            return "🔒 Cannot decrypt";
        }
    }
    
    // ==================== AUTH STATE ====================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            // User is signed in
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatDashboard').style.display = 'flex';
            
            // Get user name from Firestore
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                document.getElementById('userName').innerText = userDoc.data().name;
            }
            
            loadUsers();
        } else {
            // User is signed out
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('chatDashboard').style.display = 'none';
            document.getElementById('chatRoom').style.display = 'none';
            
            // Cleanup message listener
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
        }
    });
    
    // ==================== AUTH HANDLER ====================
    async function handleAuth() {
        const name = document.getElementById('nameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        
        // Validation
        if (!name || !email || !password) {
            alert("❌ Please fill all fields!");
            return;
        }
        
        if (password.length < 6) {
            alert("❌ Password must be at least 6 characters!");
            return;
        }
        
        try {
            // Try to sign in
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            console.log("Signed in:", userCredential.user.email);
            
        } catch (error) {
            if (error.code === 'auth/user-not-found') {
                // User doesn't exist - create new account
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    
                    // Save user name to Firestore
                    await db.collection('users').doc(userCredential.user.uid).set({
                        name: name,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        online: true
                    });
                    
                    console.log("New account created!");
                    
                } catch (signUpError) {
                    alert("Error creating account: " + signUpError.message);
                }
            } else {
                alert("Login Error: " + error.message);
            }
        }
    }
    
    // ==================== LOAD USERS ====================
    function loadUsers() {
        db.collection('users').onSnapshot((snapshot) => {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';
            
            let hasOtherUsers = false;
            
            snapshot.forEach((doc) => {
                // Don't show current user
                if (doc.id !== auth.currentUser.uid) {
                    hasOtherUsers = true;
                    const userData = doc.data();
                    
                    const userDiv = document.createElement('div');
                    userDiv.className = 'user';
                    userDiv.onclick = () => openChat(doc.id, userData.name);
                    
                    userDiv.innerHTML = `
                        <div class="user-avatar">${userData.name.charAt(0).toUpperCase()}</div>
                        <div style="flex:1">
                            <div style="font-weight:bold; margin-bottom:5px;">${userData.name}</div>
                            <div style="font-size:12px; color:#8696a0;">${userData.online ? '🟢 Online' : '⚪ Offline'}</div>
                        </div>
                    `;
                    
                    userList.appendChild(userDiv);
                }
            });
            
            if (!hasOtherUsers) {
                userList.innerHTML = '<div class="empty-state">👥 No other users found<br><small>Share this app with friends!</small></div>';
            }
        });
    }
    
    // ==================== OPEN CHAT ====================
    function openChat(userId, userName) {
        currentChatUserId = userId;
        currentChatUserName = userName;
        
        document.getElementById('chatDashboard').style.display = 'none';
        document.getElementById('chatRoom').style.display = 'flex';
        document.getElementById('chatWith').innerText = userName;
        
        loadMessages(userId);
    }
    
    // ==================== LOAD MESSAGES ====================
    function loadMessages(otherUserId) {
        // Cleanup previous listener
        if (unsubscribeMessages) {
            unsubscribeMessages();
        }
        
        const currentUserId = auth.currentUser.uid;
        
        // Create chat room ID (sorted user IDs)
        const chatRoomId = currentUserId < otherUserId 
            ? currentUserId + '_' + otherUserId 
            : otherUserId + '_' + currentUserId;
        
        // Listen for messages
        unsubscribeMessages = db.collection('chats')
            .doc(chatRoomId)
            .collection('messages')
            .orderBy('timestamp', 'asc')
            .onSnapshot((snapshot) => {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = '';
                
                if (snapshot.empty) {
                    messageArea.innerHTML = '<div class="empty-state">💬 No messages yet<br><small>Say hello! 👋</small></div>';
                    return;
                }
                
                snapshot.forEach((doc) => {
                    const msgData = doc.data();
                    const messageClass = msgData.senderId === currentUserId ? 'sent' : 'received';
                    
                    // Decrypt message
                    const decryptedText = decryptMessage(msgData.text);
                    
                    // Format time
                    let timeStr = '';
                    if (msgData.timestamp) {
                        const date = msgData.timestamp.toDate();
                        timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                    
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${messageClass}`;
                    messageDiv.innerHTML = `
                        <div>${decryptedText}</div>
                        <div class="timestamp">${timeStr}</div>
                    `;
                    
                    messageArea.appendChild(messageDiv);
                });
                
                // Scroll to bottom
                messageArea.scrollTop = messageArea.scrollHeight;
            });
    }
    
    // ==================== SEND MESSAGE ====================
    async function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const messageText = messageInput.value.trim();
        
        if (!messageText || !currentChatUserId) return;
        
        const currentUserId = auth.currentUser.uid;
        
        // Create chat room ID
        const chatRoomId = currentUserId < currentChatUserId 
            ? currentUserId + '_' + currentChatUserId 
            : currentChatUserId + '_' + currentUserId;
        
        // Encrypt message
        const encryptedText = encryptMessage(messageText);
        
        try {
            await db.collection('chats')
                .doc(chatRoomId)
                .collection('messages')
                .add({
                    text: encryptedText,
                    senderId: currentUserId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            
            // Clear input
            messageInput.value = '';
            
        } catch (error) {
            console.error("Error sending message:", error);
            alert("Failed to send message!");
        }
    }
    
    // ==================== GO TO DASHBOARD ====================
    function goToDashboard() {
        document.getElementById('chatDashboard').style.display = 'flex';
        document.getElementById('chatRoom').style.display = 'none';
        
        // Cleanup message listener
        if (unsubscribeMessages) {
            unsubscribeMessages();
            unsubscribeMessages = null;
        }
        
        currentChatUserId = null;
    }
    
    // ==================== HELPER FUNCTIONS ====================
    // Handle Enter key
    document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    // Handle Enter key on auth
    document.getElementById('passwordInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleAuth();
        }
    });
    
</script>
</body>
</html>
