<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #111b21;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Container */
        #chatContainer {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0b141a;
            position: relative;
        }

        /* Header - Fixed at Top */
        .chat-header {
            background: #1f2c34;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2a3942;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            font-size: 24px;
            cursor: pointer;
            color: #00a884;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: #00a884;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            color: #e9edef;
            margin-bottom: 4px;
        }

        .user-status {
            font-size: 12px;
            color: #8696a0;
        }

        /* Messages Area - Scrollable */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            background: #0b141a;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Important for keyboard */
            height: calc(100vh - 130px);
        }

        /* Message Bubbles */
        .message-wrapper {
            max-width: 75%;
            animation: fadeIn 0.2s;
        }

        .sent {
            align-self: flex-end;
        }

        .received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 8px 12px;
            border-radius: 12px;
            word-wrap: break-word;
            position: relative;
        }

        .sent .message-bubble {
            background: #005c4b;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .received .message-bubble {
            background: #1f2c34;
            color: #e9edef;
            border-bottom-left-radius: 2px;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            text-align: right;
        }

        /* Input Area - Fixed at Bottom */
        .input-area {
            background: #1f2c34;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #2a3942;
            position: sticky;
            bottom: 0;
            z-index: 10;
            /* Important for keyboard */
            width: 100%;
            min-height: 60px;
        }

        .message-input {
            flex: 1;
            background: #2a3942;
            border: none;
            border-radius: 25px;
            padding: 12px 18px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .message-input:focus {
            background: #3b4a54;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            background: #00a884;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: #3b4a54;
            cursor: not-allowed;
        }

        .attach-btn, .emoji-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            flex-shrink: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Empty State */
        .welcome-message {
            text-align: center;
            color: #8696a0;
            padding: 40px 20px;
        }

        .welcome-message i {
            font-size: 60px;
            color: #00a884;
            margin-bottom: 15px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .message-wrapper {
                max-width: 85%;
            }
        }
    </style>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="chatContainer">
        <!-- Header -->
        <div class="chat-header">
            <i class="fas fa-arrow-left back-btn"></i>
            <div class="user-avatar">M</div>
            <div class="user-info">
                <div class="user-name">Mirza</div>
                <div class="user-status">online</div>
            </div>
            <i class="fas fa-phone-alt" style="color: #00a884; font-size: 20px; margin-right: 15px;"></i>
            <i class="fas fa-video" style="color: #00a884; font-size: 20px;"></i>
        </div>

        <!-- Messages Area -->
        <div class="messages-area" id="messagesArea">
            <div class="welcome-message">
                <i class="fas fa-lock"></i>
                <h3>Messages are private</h3>
                <p>Say hello to Mirza! 👋</p>
            </div>
            
            <!-- Sample Messages -->
            <div class="message-wrapper received">
                <div class="message-bubble">
                    <div>Hi! Kaise ho?</div>
                    <div class="message-time">10:30 AM</div>
                </div>
            </div>
            
            <div class="message-wrapper sent">
                <div class="message-bubble">
                    <div>Main theek hoon, tum?</div>
                    <div class="message-time">10:31 AM</div>
                </div>
            </div>
            
            <div class="message-wrapper received">
                <div class="message-bubble">
                    <div>Badhiya! Kya kar rahe ho?</div>
                    <div class="message-time">10:32 AM</div>
                </div>
            </div>
            
            <div class="message-wrapper sent">
                <div class="message-bubble">
                    <div>Bas app bana raha hoon!</div>
                    <div class="message-time">10:33 AM</div>
                </div>
            </div>
        </div>

        <!-- Input Area - Fixed at Bottom -->
        <div class="input-area">
            <i class="fas fa-smile emoji-btn"></i>
            <i class="fas fa-paperclip attach-btn"></i>
            <input type="text" class="message-input" id="messageInput" placeholder="Type a message" autocomplete="off">
            <button class="send-btn" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        // Smooth scroll to bottom on new message
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        // Auto scroll to bottom on page load
        window.onload = function() {
            messagesArea.scrollTop = messagesArea.scrollHeight;
        };
        
        // Handle keyboard appearance
        messageInput.addEventListener('focus', function() {
            // Small delay to let keyboard appear
            setTimeout(() => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 300);
        });
        
        // Send message function
        function sendMessage() {
            const text = messageInput.value.trim();
            if(!text) return;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Create new message
            const messageWrapper = document.createElement('div');
            messageWrapper.className = 'message-wrapper sent';
            messageWrapper.innerHTML = `
                <div class="message-bubble">
                    <div>${text}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            messagesArea.appendChild(messageWrapper);
            messageInput.value = '';
            
            // Scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;
            
            // Simulate reply after 1 second
            setTimeout(() => {
                const replyWrapper = document.createElement('div');
                replyWrapper.className = 'message-wrapper received';
                replyWrapper.innerHTML = `
                    <div class="message-bubble">
                        <div>👍</div>
                        <div class="message-time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                `;
                messagesArea.appendChild(replyWrapper);
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 1000);
        }
        
        // Send on Enter key
        messageInput.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        
        // Handle keyboard show/hide
        if(window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }
        
        // Back button functionality
        document.querySelector('.back-btn').addEventListener('click', () => {
            alert('Going back to chats');
        });
    </script>
</body>
</html>
