<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quvra - Secure Messaging</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .app-container {
            width: 400px;
            height: 700px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            background: #075e54;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo span {
            background: #25D366;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .header-icons {
            display: flex;
            gap: 20px;
        }
        
        .header-icons i {
            cursor: pointer;
            font-size: 20px;
        }
        
        /* Encryption Key Section */
        .key-section {
            background: #f0f2f5;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .key-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #075e54;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .key-display {
            background: white;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #075e54;
        }
        
        #encryptionKey {
            font-family: monospace;
            font-size: 16px;
            color: #075e54;
            letter-spacing: 2px;
        }
        
        .copy-key {
            background: #075e54;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: #f0f2f5;
            border-bottom: 1px solid #ddd;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #075e54;
            border-bottom: 3px solid #075e54;
            background: white;
        }
        
        /* Chats Container */
        .chats-container, .contacts-container {
            flex: 1;
            overflow-y: auto;
            display: block;
        }
        
        .contacts-container {
            display: none;
        }
        
        /* Search Bar */
        .search-bar {
            padding: 10px;
            background: #f0f2f5;
        }
        
        .search-bar input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 20px;
            outline: none;
            background: white;
        }
        
        /* Chat Items */
        .chat-item {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .chat-item:hover {
            background: #f5f5f5;
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 15px;
        }
        
        .chat-info {
            flex: 1;
        }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .chat-name {
            font-weight: bold;
            color: #333;
        }
        
        .chat-time {
            font-size: 12px;
            color: #999;
        }
        
        .chat-last-msg {
            color: #666;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        
        .unread-badge {
            background: #25D366;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
        }
        
        /* Chat Window */
        .chat-window {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #e5ddd5;
        }
        
        .chat-window.active {
            display: flex;
        }
        
        .chat-header-detail {
            background: #075e54;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .back-btn {
            cursor: pointer;
            font-size: 20px;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23e5ddd5" opacity="0.4"/></svg>');
        }
        
        .message {
            max-width: 70%;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 10px;
            position: relative;
            clear: both;
        }
        
        .message.sent {
            background: #dcf8c6;
            float: right;
        }
        
        .message.received {
            background: white;
            float: left;
        }
        
        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        
        .encrypted-badge {
            background: #075e54;
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 5px;
        }
        
        /* Message Input */
        .message-input {
            background: #f0f2f5;
            padding: 15px;
            display: flex;
            gap: 10px;
        }
        
        .message-input input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            outline: none;
        }
        
        .message-input button {
            background: #075e54;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }
        
        .send-btn {
            background: #075e54;
        }
        
        /* Contacts */
        .contact-item {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            align-items: center;
        }
        
        .contact-item:hover {
            background: #f5f5f5;
        }
        
        .contact-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #25D366;
            margin-left: 10px;
        }
        
        .contact-status.offline {
            background: #999;
        }
        
        .add-contact {
            padding: 15px;
            text-align: center;
            background: #f0f2f5;
            cursor: pointer;
            color: #075e54;
            font-weight: bold;
        }
    </style>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                Quvra 
                <span>Beta</span>
            </div>
            <div class="header-icons">
                <i class="fas fa-camera"></i>
                <i class="fas fa-ellipsis-vertical"></i>
            </div>
        </div>
        
        <!-- Encryption Key Section -->
        <div class="key-section">
            <div class="key-label">
                <i class="fas fa-lock" style="color: #075e54;"></i>
                <span>End-to-End Encryption Key</span>
            </div>
            <div class="key-display">
                <span id="encryptionKey">QVR-4A8F-2B9C-7D3E-1F5G</span>
                <button class="copy-key" onclick="copyEncryptionKey()">
                    <i class="far fa-copy"></i> Copy
                </button>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('chats')">Chats</div>
            <div class="tab" onclick="switchTab('contacts')">Contacts</div>
        </div>
        
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search or start new chat" id="searchInput">
        </div>
        
        <!-- Chats List -->
        <div class="chats-container" id="chatsContainer">
            <!-- Chat items will be added here dynamically -->
        </div>
        
        <!-- Contacts List -->
        <div class="contacts-container" id="contactsContainer">
            <div class="add-contact" onclick="showAddContact()">
                <i class="fas fa-user-plus"></i> Add New Contact
            </div>
            <!-- Contacts will be added here -->
        </div>
        
        <!-- Chat Window -->
        <div class="chat-window" id="chatWindow">
            <div class="chat-header-detail">
                <i class="fas fa-arrow-left back-btn" onclick="closeChat()"></i>
                <div class="chat-avatar" id="chatAvatar">JD</div>
                <div>
                    <div id="chatName">John Doe</div>
                    <small>online</small>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will appear here -->
            </div>
            <div class="message-input">
                <input type="text" placeholder="Type a message" id="messageText">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Sample data
        let contacts = [
            { id: 1, name: 'Rahul Sharma', status: 'online', avatar: 'RS', lastSeen: 'now' },
            { id: 2, name: 'Priya Patel', status: 'online', avatar: 'PP', lastSeen: '5m ago' },
            { id: 3, name: 'Amit Kumar', status: 'offline', avatar: 'AK', lastSeen: '2h ago' },
            { id: 4, name: 'Neha Singh', status: 'online', avatar: 'NS', lastSeen: 'now' }
        ];
        
        let chats = [
            { id: 1, name: 'Rahul Sharma', lastMessage: 'Hey! Kaise ho?', time: '10:30 AM', unread: 2, avatar: 'RS', messages: [] },
            { id: 2, name: 'Priya Patel', lastMessage: 'Kal milte hain', time: '9:15 AM', unread: 0, avatar: 'PP', messages: [] },
            { id: 3, name: 'Amit Kumar', lastMessage: 'Thanks! 👍', time: 'Yesterday', unread: 0, avatar: 'AK', messages: [] }
        ];
        
        let currentChat = null;
        let encryptionKey = generateEncryptionKey();
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('encryptionKey').textContent = encryptionKey;
            renderChats();
            renderContacts();
        });
        
        // Generate random encryption key
        function generateEncryptionKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = 'QVR-';
            for(let i = 0; i < 4; i++) {
                for(let j = 0; j < 4; j++) {
                    key += chars[Math.floor(Math.random() * chars.length)];
                }
                if(i < 3) key += '-';
            }
            return key;
        }
        
        // Copy encryption key
        function copyEncryptionKey() {
            navigator.clipboard.writeText(encryptionKey);
            alert('Encryption key copied! 🔐');
        }
        
        // Switch between tabs
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const chatsContainer = document.getElementById('chatsContainer');
            const contactsContainer = document.getElementById('contactsContainer');
            
            tabs.forEach(t => t.classList.remove('active'));
            
            if(tab === 'chats') {
                tabs[0].classList.add('active');
                chatsContainer.style.display = 'block';
                contactsContainer.style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                chatsContainer.style.display = 'none';
                contactsContainer.style.display = 'block';
            }
        }
        
        // Render chats
        function renderChats() {
            const container = document.getElementById('chatsContainer');
            container.innerHTML = '';
            
            chats.forEach(chat => {
                const chatElement = createChatElement(chat);
                container.appendChild(chatElement);
            });
        }
        
        // Create chat element
        function createChatElement(chat) {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.onclick = () => openChat(chat);
            
            div.innerHTML = `
                <div class="chat-avatar">${chat.avatar}</div>
                <div class="chat-info">
                    <div class="chat-header">
                        <span class="chat-name">${chat.name}</span>
                        <span class="chat-time">${chat.time}</span>
                    </div>
                    <div class="chat-last-msg">
                        <span>${chat.lastMessage}</span>
                        ${chat.unread > 0 ? `<span class="unread-badge">${chat.unread}</span>` : ''}
                    </div>
                </div>
            `;
            
            return div;
        }
        
        // Render contacts
        function renderContacts() {
            const container = document.getElementById('contactsContainer');
            // Keep the add contact button
            const addButton = container.firstElementChild;
            container.innerHTML = '';
            container.appendChild(addButton);
            
            contacts.forEach(contact => {
                const contactElement = createContactElement(contact);
                container.appendChild(contactElement);
            });
        }
        
        // Create contact element
        function createContactElement(contact) {
            const div = document.createElement('div');
            div.className = 'contact-item';
            div.onclick = () => startChatWithContact(contact);
            
            div.innerHTML = `
                <div class="chat-avatar">${contact.avatar}</div>
                <div class="chat-info">
                    <div class="chat-header">
                        <span class="chat-name">${contact.name}</span>
                        <span class="contact-status ${contact.status === 'online' ? '' : 'offline'}"></span>
                    </div>
                    <div class="chat-last-msg">
                        <span>${contact.status === 'online' ? '🟢 Online' : '⚪ Last seen ' + contact.lastSeen}</span>
                    </div>
                </div>
            `;
            
            return div;
        }
        
        // Open chat
        function openChat(chat) {
            currentChat = chat;
            document.querySelector('.app-container').style.height = '700px';
            document.getElementById('chatsContainer').style.display = 'none';
            document.getElementById('contactsContainer').style.display = 'none';
            document.querySelector('.search-bar').style.display = 'none';
            document.querySelector('.tabs').style.display = 'none';
            document.getElementById('chatWindow').classList.add('active');
            
            document.getElementById('chatName').textContent = chat.name;
            document.getElementById('chatAvatar').textContent = chat.avatar;
            
            loadMessages(chat);
        }
        
        // Close chat
        function closeChat() {
            document.getElementById('chatWindow').classList.remove('active');
            document.getElementById('chatsContainer').style.display = 'block';
            document.querySelector('.search-bar').style.display = 'block';
            document.querySelector('.tabs').style.display = 'flex';
            currentChat = null;
        }
        
        // Load messages for a chat
        function loadMessages(chat) {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = '';
            
            // Add some sample messages
            const sampleMessages = [
                { text: 'Hey! Kaise ho?', type: 'received', time: '10:30 AM' },
                { text: 'Main theek hoon, tum?', type: 'sent', time: '10:31 AM' },
                { text: 'Badhiya! Kya kar rahe ho?', type: 'received', time: '10:32 AM' },
                { text: 'Bas Quvra app bana raha hoon! 🚀', type: 'sent', time: '10:33 AM' }
            ];
            
            sampleMessages.forEach(msg => {
                const messageElement = createMessageElement(msg.text, msg.type, msg.time);
                messagesContainer.appendChild(messageElement);
            });
        }
        
        // Create message element
        function createMessageElement(text, type, time) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            // Encrypt message (simple base64 for demo)
            const encryptedText = btoa(text);
            
            div.innerHTML = `
                <div>${text}</div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="message-time">${time}</span>
                    <span class="encrypted-badge" title="Encrypted: ${encryptedText}">🔒</span>
                </div>
            `;
            
            return div;
        }
