<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUVRO Ultra-Secure</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --primary: #075e54; --bg: #e5ddd5; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        .header { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        #chatDashboard, #chatRoom { display: none; height: 100vh; flex-direction: column; max-width: 500px; margin: auto; background: white; }
        #messageArea { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: #e5ddd5; }
        .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 14px; position: relative; }
        .msg-sent { background: #dcf8c6; align-self: flex-end; }
        .msg-received { background: white; align-self: flex-start; }
        .secure-tag { font-size: 10px; color: #075e54; text-align: center; margin: 10px 0; background: #fff9c4; padding: 5px; border-radius: 5px; }
        .input-area { display: flex; padding: 10px; background: #f0f0f0; }
        .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        .user-card { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
    </style>
</head>
<body>
    <div id="authScreen" style="padding:50px; text-align:center; height:100vh; background:white;">
        <h1 style="color:#075e54; font-size:45px;">QUVRO</h1>
        <p>🔒 End-to-End Encrypted</p>
        <input type="text" id="regName" placeholder="Full Name" style="width:85%; padding:10px; margin-bottom:10px;">
        <input type="email" id="userEmail" placeholder="Email" style="width:85%; padding:10px; margin-bottom:10px;">
        <input type="password" id="userPass" placeholder="Password" style="width:85%; padding:10px; margin-bottom:15px;">
        <button onclick="handleAuth()" style="width:90%; padding:12px; background:#075e54; color:white; border:none; border-radius:5px; font-weight:bold;">Secure Login</button>
    </div>

    <div id="chatDashboard">
        <div class="header"><h2>QUVRO</h2> <button onclick="logout()" style="background:none; border:1px solid white; color:white;">Logout</button></div>
        <div id="chatsListSection" style="flex:1; overflow-y:auto;"></div>
    </div>

    <div id="chatRoom">
        <div class="header">
            <button onclick="backToDashboard()" style="background:none; border:none; color:white; font-size:24px;">⬅</button>
            <h2 id="chatFriendName" style="margin:0; font-size:18px;">Chat</h2>
            <div style="display:flex;">
                <button onclick="startCall('audio')" style="background:none; border:none; color:white; font-size:18px; margin-right:15px;">📞</button>
                <button onclick="startCall('video')" style="background:none; border:none; color:white; font-size:18px;">📹</button>
            </div>
        </div>
        <div id="messageArea"><div class="secure-tag">Messages are end-to-end encrypted.</div></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Secure Message...">
            <button onclick="sendMessage()" style="background:#075e54; color:white; border:none; width:45px; height:45px; border-radius:50%; margin-left:10px;">➤</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
            authDomain: "quvro-b3923.firebaseapp.com",
            databaseURL: "https://quvro-b3923-default-rtdb.firebaseio.com",
            projectId: "quvro-b3923",
            storageBucket: "quvro-b3923.firebasestorage.app",
            messagingSenderId: "46528123402",
            appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const SECRET_KEY = "Quvro_Ultra_Secure_Baig_786"; 

        let currentUser = null, activeChatId = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('chatDashboard').style.display = 'flex';
                syncUsers();
            } else {
                document.getElementById('authScreen').style.display = 'block';
                document.getElementById('chatDashboard').style.display = 'none';
            }
        });

        function encrypt(text) { return CryptoJS.AES.encrypt(text, SECRET_KEY).toString(); }
        function decrypt(cipher) { 
            try { return CryptoJS.AES.decrypt(cipher, SECRET_KEY).toString(CryptoJS.enc.Utf8); } 
            catch(e) { return "---"; } 
        }

        function syncUsers() {
            db.collection('users').onSnapshot(snap => {
                const list = document.getElementById('chatsListSection'); list.innerHTML = "";
                snap.forEach(doc => {
                    if(doc.id !== currentUser.uid) {
                        list.innerHTML += `<div class="user-card" onclick="startChat('${doc.id}', '${doc.data().name}')"><strong>${doc.data().name}</strong></div>`;
                    }
                });
            });
        }

        function startCall(type) {
            const room = "QUVRO_" + (currentUser.uid < activeChatId ? currentUser.uid + activeChatId : activeChatId + currentUser.uid);
            window.open(`https://meet.jit.si/${room}`, '_blank');
        }

        function startChat(id, name) {
            activeChatId = id;
            document.getElementById('chatDashboard').style.display = 'none';
            document.getElementById('chatRoom').style.display = 'flex';
            document.getElementById('chatFriendName').innerText = name;
            listenMsgs();
        }

        function listenMsgs() {
            const rid = currentUser.uid < activeChatId ? currentUser.uid + "_" + activeChatId : activeChatId + "_" + currentUser.uid;
            db.collection('chats').doc(rid).collection('messages').orderBy('timestamp','asc').onSnapshot(snap => {
                const area = document.getElementById('messageArea'); 
                area.innerHTML = `<div class="secure-tag">Messages are end-to-end encrypted.</div>`;
                snap.forEach(doc => {
                    const m = doc.data(); const isMe = m.senderId === currentUser.uid;
                    area.innerHTML += `<div class="msg-bubble ${isMe?'msg-sent':'msg-received'}">${decrypt(m.text)}</div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        async function sendMessage() {
            const inp = document.getElementById('msgInput'); if(!inp.value.trim()) return;
            const rid = currentUser.uid < activeChatId ? currentUser.uid + "_" + activeChatId : activeChatId + "_" + currentUser.uid;
            await db.collection('chats').doc(rid).collection('messages').add({ text: encrypt(inp.value), senderId: currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            inp.value = "";
        }

        function backToDashboard() { document.getElementById('chatDashboard').style.display = 'flex'; document.getElementById('chatRoom').style.display = 'none'; }
        function logout() { auth.signOut(); }
        async function handleAuth() {
            const e = document.getElementById('userEmail').value, p = document.getElementById('userPass').value, n = document.getElementById('regName').value;
            if(e && p) await auth.signInWithEmailAndPassword(e, p).catch(() => {
                auth.createUserWithEmailAndPassword(e, p).then(res => {
                    res.user.updateProfile({displayName: n});
                    db.collection('users').doc(res.user.uid).set({ name: n, email: e });
                });
            });
        }
    </script>
</body>
  </html>
