<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO - Private Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #075e54;
            --primary-dark: #054c44;
            --secondary: #25D366;
            --bg-main: #111b21;
            --bg-card: #1f2c34;
            --bg-input: #2a3942;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --border-color: #2a3942;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }

        #appContainer {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            margin: 0 auto;
            background: var(--bg-main);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: var(--bg-main);
        }

        .screen.active { display: flex; }

        /* Auth Screen */
        #authScreen { background: linear-gradient(145deg, var(--primary), var(--primary-dark)); }
        .auth-header { padding: 40px 20px 20px; text-align: center; color: white; }
        .auth-logo { width: 90px; height: 90px; background: rgba(255,255,255,0.15); border-radius: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 50px; backdrop-filter: blur(10px); }
        .auth-title { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
        .auth-badges { display: flex; gap: 15px; justify-content: center; font-size: 13px; }
        .auth-badges span { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; }
        .auth-tabs { display: flex; background: var(--bg-card); margin: 20px 20px 0; border-radius: 15px; padding: 5px; }
        .auth-tab { flex: 1; text-align: center; padding: 14px; color: var(--text-secondary); cursor: pointer; border-radius: 12px; }
        .auth-tab.active { background: var(--primary); color: white; }
        .auth-form { flex: 1; background: var(--bg-main); padding: 20px; border-radius: 30px 30px 0 0; margin-top: 10px; }
        .input-group { margin-bottom: 20px; }
        .input-label { color: var(--text-secondary); font-size: 13px; margin-bottom: 6px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 15px; color: var(--text-secondary); }
        .input-wrapper input, .input-wrapper select { width: 100%; padding: 16px 16px 16px 45px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 15px; color: var(--text-primary); font-size: 16px; outline: none; }
        .input-wrapper input:focus { border-color: var(--secondary); }
        .password-toggle { position: absolute; right: 15px; color: var(--text-secondary); cursor: pointer; }
        .phone-group { display: flex; gap: 10px; }
        .country-code { width: 100px; padding: 16px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 15px; color: var(--text-primary); }
        .links-row { display: flex; justify-content: space-between; margin: 15px 0; }
        .links-row a { color: var(--secondary); cursor: pointer; font-size: 14px; }
        .quvro-btn { width: 100%; padding: 18px; background: var(--secondary); border: none; border-radius: 30px; font-size: 17px; font-weight: 600; color: #111; cursor: pointer; margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Dashboard Screen */
        .dashboard-header { background: var(--bg-card); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .dashboard-title { font-size: 24px; font-weight: bold; color: var(--secondary); }
        .header-icons { display: flex; gap: 20px; }
        .header-icons i { font-size: 22px; color: var(--text-secondary); cursor: pointer; }
        .search-bar { padding: 10px 15px; background: var(--bg-card); }
        .search-bar input { width: 100%; padding: 12px 20px; background: var(--bg-input); border: none; border-radius: 25px; color: var(--text-primary); }
        .chats-list { flex: 1; overflow-y: auto; padding: 5px 0; height: calc(100vh - 130px); }
        .chat-item { padding: 12px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .chat-item:hover { background: var(--bg-card); }
        .chat-avatar { width: 50px; height: 50px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; position: relative; }
        .online-dot { width: 12px; height: 12px; background: #4caf50; border-radius: 50%; position: absolute; bottom: 2px; right: 2px; border: 2px solid var(--bg-card); }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; margin-bottom: 5px; }
        .chat-preview { color: var(--text-secondary); font-size: 13px; display: flex; justify-content: space-between; }

        /* Chat Screen */
        .chat-header { background: var(--bg-card); padding: 12px 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border-color); }
        .back-btn { font-size: 24px; cursor: pointer; color: var(--secondary); }
        .chat-user-info { flex: 1; }
        .chat-user-name { font-weight: 600; margin-bottom: 3px; }
        .chat-user-status { font-size: 12px; color: var(--text-secondary); }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px 15px; background: #0b141a; display: flex; flex-direction: column; height: calc(100vh - 150px); }
        .message-wrapper { max-width: 75%; margin-bottom: 8px; }
        .message-sent { align-self: flex-end; }
        .message-received { align-self: flex-start; }
        .message-bubble { padding: 10px 15px; border-radius: 15px; position: relative; }
        .message-sent .message-bubble { background: var(--primary); border-bottom-right-radius: 2px; }
        .message-received .message-bubble { background: var(--bg-card); border-bottom-left-radius: 2px; }
        .message-time { font-size: 10px; color: var(--text-secondary); margin-top: 3px; text-align: right; }
        .message-input-area { background: var(--bg-card); padding: 15px; display: flex; gap: 10px; align-items: center; position: absolute; bottom: 0; width: 100%; }
        .message-input-area input { flex: 1; padding: 12px 20px; background: var(--bg-input); border: none; border-radius: 25px; color: var(--text-primary); }
        .send-btn { width: 50px; height: 50px; background: var(--secondary); border: none; border-radius: 50%; color: #111; cursor: pointer; }

        /* Popup */
        #messagePopup { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: var(--bg-card); border-radius: 50px; color: white; display: none; align-items: center; gap: 10px; z-index: 1000; border-left: 4px solid var(--secondary); }
    </style>
</head>
<body>
    <div id="appContainer">
        <div id="messagePopup">
            <i id="popupIcon" class="fas fa-check-circle" style="color: #25D366;"></i>
            <span id="popupText"></span>
        </div>

        <div id="authScreen" class="screen active">
            <div class="auth-header">
                <div class="auth-logo"><i class="fas fa-comment-dots"></i></div>
                <div class="auth-title">QUVRO</div>
                <div class="auth-badges">
                    <span><i class="fas fa-shield-alt"></i> Secure</span>
                    <span><i class="fas fa-lock"></i> Private</span>
                    <span><i class="fas fa-bolt"></i> Fast</span>
                </div>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">Login</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">Register</div>
            </div>

            <div id="loginForm" class="auth-form">
                <div class="input-group">
                    <div class="input-label">Phone Number</div>
                    <div class="input-wrapper">
                        <i class="fas fa-phone-alt input-icon"></i>
                        <input type="tel" id="loginPhone" placeholder="Enter phone number">
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-label">Password</div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Enter password">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('loginPassword', this)"></i>
                    </div>
                </div>
                <div class="links-row">
                    <a onclick="forgotPassword()">Forgot password?</a>
                    <a onclick="switchAuthTab('register')">Create account</a>
                </div>
                <button class="quvro-btn" onclick="handleLogin()">
                    <span>Login to QUVRO</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <div id="registerForm" class="auth-form" style="display: none;">
                <div class="input-group">
                    <div class="input-label">Full Name</div>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="registerName" placeholder="Your name">
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-label">Phone Number</div>
                    <div class="phone-group">
                        <select class="country-code" id="countryCode">
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+92">🇵🇰 +92</option>
                        </select>
                        <div class="input-wrapper" style="flex:1;">
                            <i class="fas fa-phone-alt input-icon"></i>
                            <input type="tel" id="registerPhone" placeholder="Phone number">
                        </div>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-label">Password</div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="registerPassword" placeholder="Create password">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('registerPassword', this)"></i>
                    </div>
                </div>
                <button class="quvro-btn" onclick="handleRegister()">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </div>
        </div>

        <div id="dashboardScreen" class="screen">
            <div class="dashboard-header">
                <div class="dashboard-title">QUVRO</div>
                <div class="header-icons">
                    <i class="fas fa-camera"></i>
                    <i class="fas fa-sign-out-alt" onclick="logout()" title="Logout"></i>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search chats..." id="searchChats">
            </div>
            <div class="chats-list" id="chatsList">
                </div>
        </div>

        <div id="chatScreen" class="screen">
            <div class="chat-header">
                <i class="fas fa-arrow-left back-btn" onclick="closeChat()"></i>
                <div class="chat-avatar" id="chatAvatar">JD</div>
                <div class="chat-user-info">
                    <div class="chat-user-name" id="chatUserName">Loading...</div>
                    <div class="chat-user-status" id="chatUserStatus">online</div>
                </div>
                <div class="header-icons">
                    <i class="fas fa-phone-alt"></i>
                    <i class="fas fa-video"></i>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer">
                </div>
            <div class="message-input-area">
                <input type="text" placeholder="Type a message" id="messageInput" onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Storage
        let users = [];
        let currentUser = null;
        let currentChat = null;
        let messages = {};
        let popupTimeout;

        // ULTRA-SAFE LOAD DATA (Preview App Crash Preventer)
        function loadData() {
            try {
                // Pehle check karein ki window.localStorage available hai ya nahi
                if (typeof window.localStorage !== 'undefined') {
                    const saved = window.localStorage.getItem('quvro_users');
                    if(saved) users = JSON.parse(saved);
                    else users = [];
                    
                    const savedMessages = window.localStorage.getItem('quvro_messages');
                    if(savedMessages) messages = JSON.parse(savedMessages);
                    else messages = {};
                }
            } catch (error) {
                // Agar previewer ne block kiya hai, toh crash mat ho, temporary memory use karo!
                console.warn("Mobile Previewer restricted storage access. Using temporary memory.");
                users = [];
                messages = {};
            }
        }
        
        loadData();

        function saveData() {
            try {
                if (typeof window.localStorage !== 'undefined') {
                    window.localStorage.setItem('quvro_users', JSON.stringify(users));
                    window.localStorage.setItem('quvro_messages', JSON.stringify(messages));
                }
            } catch (error) {
                console.warn("Cannot save data permanently in this preview mode.");
            }
        }

        // UI Functions
        function showMessage(text, type) {
            clearTimeout(popupTimeout);
            const popup = document.getElementById('messagePopup');
            const popupText = document.getElementById('popupText');
            const popupIcon = document.getElementById('popupIcon');
            
            popupText.innerText = text;
            popupIcon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            popupIcon.style.color = type === 'success' ? '#25D366' : '#f44336';
            
            popup.style.display = 'flex';
            popupTimeout = setTimeout(() => popup.style.display = 'none', 3000);
        }

        function togglePassword(inputId, element) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
            element.classList.toggle('fa-eye');
            element.classList.toggle('fa-eye-slash');
        }

        function switchAuthTab(tab) {
            const loginTab = document.querySelectorAll('.auth-tab')[0];
            const registerTab = document.querySelectorAll('.auth-tab')[1];
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Auth Logic
        function handleLogin() {
            const phone = document.getElementById('loginPhone').value;
            const pass = document.getElementById('loginPassword').value;
            
            const user = users.find(u => u.phone === phone && u.password === pass);
            if(user) {
                currentUser = user;
                document.getElementById('loginPhone').value = '';
                document.getElementById('loginPassword').value = '';
                showMessage('Login successful!', 'success');
                renderChats();
                switchScreen('dashboardScreen');
            } else {
                showMessage('Invalid phone number or password', 'error');
            }
        }

        function handleRegister() {
            const name = document.getElementById('registerName').value;
            const phone = document.getElementById('countryCode').value + document.getElementById('registerPhone').value;
            const pass = document.getElementById('registerPassword').value;

            if(!name || !document.getElementById('registerPhone').value || !pass) {
                showMessage('Please fill all details', 'error');
                return;
            }

            if(users.find(u => u.phone === phone)) {
                showMessage('Phone number already registered', 'error');
                return;
            }

            const newUser = {
                id: Date.now().toString(),
                name: name,
                phone: phone,
                password: pass,
                online: true
            };
            
            users.push(newUser);
            saveData();
            
            document.getElementById('registerName').value = '';
            document.getElementById('registerPhone').value = '';
            document.getElementById('registerPassword').value = '';
            
            showMessage('Account created! Please login.', 'success');
            switchAuthTab('login');
        }

        function forgotPassword() {
            showMessage('Password reset feature coming soon!', 'success');
        }

        function logout() {
            currentUser = null;
            currentChat = null;
            switchScreen('authScreen');
            showMessage('Logged out successfully', 'success');
        }

        // Chat Logic
        function renderChats() {
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = '';
            
            let otherUsers = users.filter(user => user.id !== currentUser.id);
            
            if(otherUsers.length === 0) {
