<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --green: #075e54; --light: #25d366; --bg: #121b22; --panel: #1f2c34; }
        body, html { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg); color: white; height: 100%; overflow: hidden; }
        
        /* Auth Screen */
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .box { width: 85%; max-width: 350px; text-align: center; background: var(--panel); padding: 30px; border-radius: 10px; }
        .logo { width: 60px; height: 60px; background: var(--green); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 30px; font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #2a3942; border: none; color: white; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { background: var(--light); color: #000; border: none; padding: 12px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        /* Main UI */
        #mainContainer { display: none; height: 100vh; flex-direction: column; }
        .bar { background: var(--panel); padding: 15px; font-weight: bold; border-bottom: 1px solid #2a3942; display: flex; justify-content: space-between; }
        .tab-content { flex: 1; overflow-y: auto; display: none; padding-bottom: 60px; }
        .active-tab { display: block; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--panel); border-top: 1px solid #2a3942; }
        .nav-item { flex: 1; padding: 15px; text-align: center; font-size: 12px; font-weight: bold; cursor: pointer; color: #8696a0; }
        .nav-active { color: var(--light); border-top: 3px solid var(--light); }

        /* Chat Room */
        #chatRoom { display: none; position: fixed; top: 0; width: 100%; height: 100%; background: var(--bg); flex-direction: column; z-index: 100; }
        #msgArea { flex: 1; overflow-y: auto; padding: 15px; background: #0b141a; display: flex; flex-direction: column; }
        .m { padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; max-width: 75%; font-size: 14px; }
        .s { background: #005c4b; align-self: flex-end; }
        .r { background: #202c33; align-self: flex-start; }

        /* Anti-Ad */
        iframe, .appsgeyser-ad { display: none !important; height: 0 !important; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="box">
        <div class="logo">Q</div>
        <h2>QUVRO PRO</h2>
        <div id="step1">
            <input type="text" id="userName" placeholder="Your Name">
            <input type="text" id="phoneNum" placeholder="+91 0000000000">
            <div id="recaptcha-container"></div>
            <button onclick="sendOTP()">SEND OTP</button>
        </div>
        <div id="step2" style="display:none;">
            <input type="text" id="otpCode" placeholder="Enter 6-Digit OTP">
            <button onclick="verifyOTP()">VERIFY & JOIN</button>
        </div>
    </div>
</div>

<div id="mainContainer">
    <div id="tab-chats" class="tab-content active-tab">
        <div class="bar">QUVRO - CHATS <span onclick="auth.signOut()">Logout</span></div>
        <div style="padding:10px;">
            <input type="text" id="searchPh" placeholder="Search Number (+91...)">
            <button onclick="searchUser()">SEARCH</button>
        </div>
        <div id="uList"></div>
    </div>

    <div id="tab-status" class="tab-content">
        <div class="bar">STATUS</div>
        <div style="padding:50px; text-align:center;">
            <button onclick="requestPermission('camera')">ADD STORY (+)</button>
            <p style="font-size:12px; color:#8696a0; margin-top:10px;">Bina permission story nahi dal sakte.</p>
        </div>
    </div>

    <div id="tab-calls" class="tab-content">
        <div class="bar">CALLS</div>
        <div style="padding:50px; text-align:center;">
            <button onclick="requestPermission('mic')">START NEW CALL</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item nav-active" onclick="switchTab('chats', this)">CHATS</div>
        <div class="nav-item" onclick="switchTab('status', this)">STATUS</div>
        <div class="nav-item" onclick="switchTab('calls', this)">CALLS</div>
    </div>
</div>

<div id="chatRoom">
    <div class="bar"><span onclick="closeChat()">⬅</span> <span id="chatWith">User</span></div>
    <div id="msgArea"></div>
    <div style="padding:10px; background:var(--panel); display:flex; gap:5px;">
        <input type="text" id="mIn" placeholder="Type a message..." style="margin:0;">
        <button onclick="sendMsg()" style="width:60px; margin:0;">></button>
    </div>
</div>

<script>
    const cfg = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        projectId: "quvro-b3923",
        storageBucket: "quvro-b3923.firebasestorage.app",
        messagingSenderId: "46528123402",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };
    firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const KEY = "Quvro_Ultra_Secure_Baig_786";

    let confirmResult;
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });

    auth.onAuthStateChanged(u => {
        if (u) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'flex';
        } else {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainContainer').style.display = 'none';
        }
    });

    // Login Logic
    async function sendOTP() {
        const ph = document.getElementById('phoneNum').value;
        if(!ph.includes('+')) return alert("Add Country Code (+91)");
        auth.signInWithPhoneNumber(ph, window.recaptchaVerifier).then(res => {
            confirmResult = res;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }).catch(e => alert(e.message));
    }

    function verifyOTP() {
        const code = document.getElementById('otpCode').value;
        const name = document.getElementById('userName').value;
        confirmResult.confirm(code).then(res => {
            db.collection('users').doc(res.user.uid).set({ name: name, phone: document.getElementById('phoneNum').value });
        }).catch(() => alert("Invalid OTP"));
    }

    // Tabs & Permissions
    function switchTab(id, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
        document.getElementById('tab-'+id).classList.add('active-tab');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
        el.classList.add('nav-active');
    }

    async function requestPermission(type) {
        try {
            const constraints = type === 'camera' ? {video:true, audio:true} : {audio:true};
            await navigator.mediaDevices.getUserMedia(constraints);
            alert(type.toUpperCase() + " Permission Granted!");
        } catch (e) {
            alert("Permission Denied! App cannot access " + type);
        }
    }

    // Chat Logic
    async function searchUser() {
        const ph = document.getElementById('searchPh').value;
        const snap = await db.collection('users').where("phone", "==", ph).get();
        const list = document.getElementById('uList'); list.innerHTML = "";
        if(snap.empty) return alert("User not found!");
        snap.forEach(d => {
            list.innerHTML += `<div style="padding:15px; border-bottom:1px solid #222;" onclick="openChat('${d.id}','${d.data().name}')">${d.data().name}</div>`;
        });
    }

    let activeID = null;
    function openChat(id, name) {
        activeID = id;
        document.getElementById('chatWith').innerText = name;
        document.getElementById('chatRoom').style.display = 'flex';
        loadMsgs();
    }

    function closeChat() { document.getElementById('chatRoom').style.display = 'none'; }

    function enc(t) { return CryptoJS.AES.encrypt(t, KEY).toString(); }
    function dec(c) { try { return CryptoJS.AES.decrypt(c, KEY).toString(CryptoJS.enc.Utf8); } catch(e){return "---";} }

    function loadMsgs() {
        const rid = auth.currentUser.uid < activeID ? auth.currentUser.uid+"_"+activeID : activeID+"_"+auth.currentUser.uid;
        db.collection('chats').doc(rid).collection('messages').orderBy('timestamp','asc').onSnapshot(s => {
            const area = document.getElementById('msgArea'); area.innerHTML = "";
            s.forEach(d => { 
                const m = d.data();
                area.innerHTML += `<div class="m ${m.sid===auth.currentUser.uid?'s':'r'}">${dec(m.txt)}</div>`;
            });
            area.scrollTop = area.scrollHeight;
        });
    }

    async function sendMsg() {
        const i = document.getElementById('mIn'); if(!i.value) return;
        const rid = auth.currentUser.uid < activeID ? auth.currentUser.uid+"_"+activeID : activeID+"_"+auth.currentUser.uid;
        await db.collection('chats').doc(rid).collection('messages').add({ txt: enc(i.value), sid: auth.currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        i.value = "";
    }

    // Ads Cleanup
    setInterval(() => { document.querySelectorAll('iframe').forEach(el => el.remove()); }, 3000);
</script>
</body>
</html>
