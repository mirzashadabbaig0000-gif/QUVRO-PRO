<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO - Secure Messenger</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <!-- Encryption Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #075e54;
            --primary-light: #128C7E;
            --secondary: #25D366;
            --bg-dark: #111b21;
            --bg-card: #1f2c34;
            --bg-input: #2a3942;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --message-sent: #005c4b;
            --message-received: #202c33;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100%;
            overflow: hidden;
        }

        /* ========== AUTH SCREEN ========== */
        #authScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(145deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: rgba(31, 44, 52, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(37, 211, 102, 0.2);
        }

        .app-logo {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 45px;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .app-name {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
            color: white;
        }

        .app-tagline {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 30px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: var(--bg-input);
            border: 1px solid #3b4a54;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--secondary);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: var(--secondary);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-btn:hover {
            background: #20b859;
            transform: translateY(-2px);
        }

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-switch span {
            color: var(--secondary);
            cursor: pointer;
            font-weight: bold;
        }

        /* ========== DASHBOARD ========== */
        #dashboardScreen {
            display: none;
            height: 100vh;
            flex-direction: column;
            background: var(--bg-dark);
        }

        .dashboard-header {
            background: var(--bg-card);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a3942;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--secondary);
        }

        .header-actions i {
            font-size: 22px;
            margin-left: 20px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .search-bar {
            padding: 10px 15px;
            background: var(--bg-card);
        }

        .search-bar input {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: none;
            border-radius: 25px;
            color: white;
            outline: none;
        }

        .users-container {
            flex: 1;
            overflow-y: auto;
            padding: 5px 0;
        }

        .user-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.3s;
            border-bottom: 1px solid #1f2c34;
        }

        .user-item:hover {
            background: #1f2c34;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            position: relative;
        }

        .online-status {
            width: 12px;
            height: 12px;
            background: #4caf50;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--bg-card);
        }

        .offline-status {
            width: 12px;
            height: 12px;
            background: #9e9e9e;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--bg-card);
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ========== CHAT SCREEN ========== */
        #chatScreen {
            display: none;
            height: 100vh;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
        }

        .chat-header {
            background: var(--bg-card);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2a3942;
        }

        .back-btn {
            font-size: 24px;
            cursor: pointer;
            color: var(--secondary);
        }

        .chat-user-info {
            flex: 1;
        }

        .chat-user-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-user-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chat-actions i {
            font-size: 22px;
            margin-left: 15px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            background: #0b141a;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper {
            margin-bottom: 8px;
            max-width: 75%;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-sent {
            align-self: flex-end;
        }

        .message-received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 10px 15px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
        }

        .message-sent .message-bubble {
            background: var(--message-sent);
            border-bottom-right-radius: 2px;
        }

        .message-received .message-bubble {
            background: var(--message-received);
            border-bottom-left-radius: 2px;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px;
            text-align: right;
        }

        .encrypted-badge {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-left: 5px;
        }

        .message-input-area {
            background: var(--bg-card);
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-input-area input {
            flex: 1;
            padding: 12px 20px;
            background: var(--bg-input);
            border: none;
            border-radius: 25px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: var(--secondary);
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .send-btn:hover {
            background: #20b859;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #3b4a54;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 50px 20px;
        }

        .welcome-message i {
            font-size: 60px;
            color: var(--secondary);
            margin-bottom: 20px;
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #2a3942;
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div id="authScreen">
    <div class="auth-container">
        <div class="app-logo">
            <i class="fas fa-comment"></i>
        </div>
        <div class="app-name">QUVRO</div>
        <div class="app-tagline">Secure • Private • Fast</div>
        
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="fullNameInput" placeholder="Enter your name">
        </div>
        
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="emailInput" placeholder="Enter email">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="••••••••">
        </div>
        
        <button class="auth-btn" id="authBtn" onclick="handleAuth()">
            <i class="fas fa-arrow-right"></i> Continue
        </button>
        
        <div class="auth-switch">
            <span id="authSwitchText" onclick="toggleAuthMode()">Create new account</span>
        </div>
    </div>
</div>

<!-- ========== DASHBOARD SCREEN ========== -->
<div id="dashboardScreen">
    <div class="dashboard-header">
        <div class="header-title">
            <i class="fas fa-comment-dots"></i> QUVRO
        </div>
        <div class="header-actions">
            <i class="fas fa-search" onclick="searchUser()"></i>
            <i class="fas fa-ellipsis-v" onclick="showMenu()"></i>
        </div>
    </div>
    
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search users..." onkeyup="filterUsers()">
    </div>
    
    <div class="users-container" id="usersList">
        <div class="welcome-message">
            <i class="fas fa-users"></i>
            <h3>Welcome to QUVRO</h3>
            <p>Connect with friends securely</p>
            <div class="spinner"></div>
        </div>
    </div>
</div>

<!-- ========== CHAT SCREEN ========== -->
<div id="chatScreen">
    <div class="chat-header">
        <i class="fas fa-arrow-left back-btn" onclick="closeChat()"></i>
        <div class="user-avatar" id="chatAvatar">
            <span id="chatAvatarText"></span>
            <span id="chatOnlineStatus" class="online-status" style="display: none;"></span>
            <span id="chatOfflineStatus" class="offline-status" style="display: none;"></span>
        </div>
        <div class="chat-user-info">
            <div class="chat-user-name" id="chatUserName">Loading...</div>
            <div class="chat-user-status" id="chatUserStatus">...</div>
        </div>
        <div class="chat-actions">
            <i class="fas fa-phone-alt"></i>
            <i class="fas fa-video"></i>
            <i class="fas fa-ellipsis-v"></i>
        </div>
    </div>
    
    <div class="messages-container" id="messagesContainer">
        <div class="welcome-message">
            <i class="fas fa-lock"></i>
            <h3>Messages are encrypted</h3>
            <p>Say hello to your friend! 👋</p>
        </div>
    </div>
    
    <div class="message-input-area">
        <i class="fas fa-smile" style="color: var(--text-secondary); font-size: 24px;"></i>
        <i class="fas fa-paperclip" style="color: var(--text-secondary); font-size: 24px;"></i>
        <input type="text" id="messageInput" placeholder="Type a message" onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    // ========== FIREBASE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        databaseURL: "https://quvro-b3923-default-rtdb.firebaseio.com",
        projectId: "quvro-b3923",
        storageBucket: "quvro-b3923.firebasestorage.app",
        messagingSenderId: "46528123402",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // ========== ENCRYPTION SETUP ==========
    const ENCRYPTION_KEY = "Quvro_Secure_Key_2025_$%^&*";
    
    function encryptMessage(text) {
        try {
            return CryptoJS.AES.encrypt(text, ENCRYPTION_KEY).toString();
        } catch (e) {
            console.error("Encryption failed:", e);
            return text;
        }
    }
    
    function decryptMessage(encryptedText) {
        try {
            const bytes = CryptoJS.AES.decrypt(encryptedText, ENCRYPTION_KEY);
            return bytes.toString(CryptoJS.enc.Utf8) || "🔒 Message";
        } catch (e) {
            console.error("Decryption failed:", e);
            return "🔒 Message";
        }
    }

    // ========== GLOBAL VARIABLES ==========
    let isLoginMode = true;
    let currentChatUser = null;
    let unsubscribeMessages = null;
    let unsubscribeUsers = null;

    // ========== AUTH STATE LISTENER ==========
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            // User is logged in
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'flex';
            
            // Update user online status
            await db.collection('users').doc(user.uid).update({
                online: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            // Load users
            loadUsers();
        } else {
            // User is logged out
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'none';
            
            // Cleanup listeners
            if (unsubscribeUsers) unsubscribeUsers();
            if (unsubscribeMessages) unsubscribeMessages();
        }
    });

    // ========== AUTH FUNCTIONS ==========
    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        const btn = document.getElementById('authBtn');
        const switchText = document.getElementById('authSwitchText');
        
        if (isLoginMode) {
            btn.innerHTML = '<i class="fas fa-arrow-right"></i> Login';
            switchText.innerText = 'Create new account';
        } else {
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
            switchText.innerText = 'Already have an account? Login';
        }
    }

    async function handleAuth() {
        const name = document.getElementById('fullNameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        
        if (!email || !password) {
            alert('Please fill all fields!');
            return;
        }
        
        if (!isLoginMode && !name) {
            alert('Name is required for sign up!');
            return;
        }
        
        try {
            if (isLoginMode) {
                // LOGIN
                await auth.signInWithEmailAndPassword(email, password);
            } else {
                // SIGN UP
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                
                // Save user data
                await db.collection('users').doc(userCredential.user.uid).set({
                    name: name,
                    email: email,
                    online: true,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('Account created successfully!');
            }
        } catch (error) {
            alert(error.message);
        }
    }

    // ========== LOAD USERS ==========
    function loadUsers() {
        const currentUser = auth.currentUser;
        if (!currentUser) return;
        
        unsubscribeUsers = db.collection('users').onSnapshot((snapshot) =>
