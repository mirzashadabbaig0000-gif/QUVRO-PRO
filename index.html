<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        /* CSS Variables - Naye Colors Screenshot Ke Hisaab Se */
        :root { 
            --yellow: #FFD700; 
            --cyan: #00FFFF; 
            --bg: #0d1117; 
            --box-bg: #161b22;
        }
        
        /* MAGIC FIX: Body ko fixed aur 100% kar diya taake screen se bahar na jaye */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: white; 
            width: 100%;
            height: 100%; 
            overflow: hidden; /* Scroll band karne ke liye */
            position: fixed; /* YEH ZAROORI HAI: Screen ko lock karne ke liye */
            top: 0; 
            left: 0;
        }
        
        /* Screens ko bhi 100% aur absolute kar diya */
        #authScreen, #chatDashboard, #chatRoom { 
            display: none; 
            width: 100%;
            height: 100%; 
            flex-direction: column; 
            position: absolute;
            top: 0; 
            left: 0;
        }
        
        /* Auth Screen Styles */
        #authScreen { display: flex; justify-content: center; align-items: center; }
        .box { width: 85%; max-width: 350px; text-align: center; background: var(--box-bg); padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .logo { width: 60px; height: 60px; border: 2px solid var(--yellow); color: var(--yellow); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 30px; font-weight: bold; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; background: #21262d; border: 1px solid #30363d; color: white; border-radius: 5px; outline: none; }
        input:focus { border-color: var(--yellow); }
        button { background: var(--yellow); color: #000; border: none; padding: 12px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:active { opacity: 0.8; }
        
        /* Chat UI Styles */
        .bar { background: var(--box-bg); padding: 15px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .bar-logo { border: 2px solid var(--yellow); border-radius: 8px; padding: 5px 12px; color: var(--yellow); font-weight: bold; font-size: 20px; }
        .bar-text-main { color: var(--yellow); font-weight: bold; font-size: 16px; }
        .bar-text-sub { color: var(--cyan); font-size: 12px; }
        
        .user { padding: 15px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user:hover { background: #1f2937; }
        
        #msgArea { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .m { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; max-width: 75%; word-wrap: break-word; }
        .s { background: #b89b00; color: black; align-self: flex-end; border-bottom-right-radius: 0; }
        .r { background: #21262d; color: white; align-self: flex-start; border-bottom-left-radius: 0; }
        
        /* Bottom Input Bar */
        .input-area { background: var(--box-bg); padding: 10px; display: flex; gap: 8px; border-top: 1px solid #30363d; flex-shrink: 0; }
        .input-area input { margin: 0; flex: 1; }
        .input-area button { width: 50px; margin: 0; font-size: 18px; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="box">
        <div class="logo">Q</div>
        <h2 style="color: var(--yellow); margin-top: 0;">QUVRO</h2>
        <input type="text" id="n" placeholder="Name (Only for Sign Up)">
        <input type="email" id="e" placeholder="Email">
        <input type="password" id="p" placeholder="Password">
        
        <button onclick="login()">LOGIN</button>
        <button onclick="signUp()" style="background: transparent; color: var(--yellow); border: 1px solid var(--yellow);">CREATE ACCOUNT</button>
        
        <p id="authError" style="color: #ff6b6b; font-size: 14px; display: none; margin-top: 10px;"></p>
    </div>
</div>

<div id="chatDashboard">
    <div class="bar">
        <div class="bar-logo">Q</div>
        <div>
            <div class="bar-text-main">QUVRO Network</div>
            <div class="bar-text-sub">● Online (Encrypted)</div>
        </div>
        <button onclick="auth.signOut()" style="width:auto; padding:8px 15px; margin-left:auto; background:#21262d; color:white; border: 1px solid #30363d;">Logout</button>
    </div>
    <div id="uList" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="chatRoom">
    <div class="bar">
        <span onclick="goDash()" style="cursor:pointer; font-size: 20px; color: var(--yellow); margin-right: 10px;">⬅</span> 
        <div class="bar-logo" style="padding: 2px 8px; font-size: 16px;">Q</div>
        <div>
            <div class="bar-text-main" id="with">User Name</div>
            <div class="bar-text-sub">● Online (Encrypted)</div>
        </div>
    </div>
    
    <div id="msgArea"></div>
    
    <div class="input-area">
        <input type="text" id="mIn" placeholder="Type a message...">
        <button onclick="send()">➤</button>
    </div>
</div>

<script>
    // Firebase Configuration
    const cfg = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        databaseURL: "https://quvro-b3923-default-rtdb.firebaseio.com",
        projectId: "quvro-b3923",
        storageBucket: "quvro-b3923.firebasestorage.app",
        messagingSenderId: "46528123402",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };
    firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // Encryption Key (DO NOT share this in production!)
    const KEY = "Quvro_Ultra_Secure_Baig_786";

    // Auth State Observer
    auth.onAuthStateChanged(u => {
        if (u) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatDashboard').style.display = 'flex';
            document.getElementById('chatRoom').style.display = 'none';
            loadU();
        } else {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('chatDashboard').style.display = 'none';
            document.getElementById('chatRoom').style.display = 'none';
        }
    });

    // Error Handling Function
    function showError(msg) {
        const err = document.getElementById('authError');
        err.innerText = msg;
        err.style.display = 'block';
    }

    // Login Function
    async function login() {
        const e = document.getElementById('e').value;
        const p = document.getElementById('p').value;
        if(!e || !p) { showError("Email aur password zaroori hai!"); return; }
        auth.signInWithEmailAndPassword(e, p).catch(err => showError("Login fail: " + err.message));
    }

    // Sign Up Function
    async function signUp() {
        const e = document.getElementById('e').value;
        const p = document.getElementById('p').value;
        const n = document.getElementById('n').value;
        if(!e || !p || !n) { showError("Naam, Email aur Password sab zaroori hain!"); return; }
        
        auth.createUserWithEmailAndPassword(e, p)
            .then(r => { db.collection('users').doc(r.user.uid).set({ name: n }); })
            .catch(err => showError("Sign Up fail: " + err.message));
    }

    // Encryption & Decryption Functions
    function enc(t) { return CryptoJS.AES.encrypt(t, KEY).toString(); }
    function dec(c) { try { return CryptoJS.AES.decrypt(c, KEY).toString(CryptoJS.enc.Utf8); } catch(e){return "---";} }

    // Load Users
    function loadU() {
        db.collection('users').onSnapshot(s => {
            const l = document.getElementById('uList'); l.innerHTML = "";
            let hasUsers = false;
            s.forEach(d => { 
                if(d.id !== auth.currentUser.uid) {
                    hasUsers = true;
                    l.innerHTML += `<div class="user" onclick="goChat('${d.id}','${d.data().name}')">
                        <div style="background:#21262d; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--yellow); font-weight:bold;">${d.data().name.charAt(0).toUpperCase()}</div>
                        <strong>${d.data().name}</strong>
                    </div>`; 
                }
            });
            if(!hasUsers) {
                l.innerHTML = `<div style="padding: 20px; text-align: center; color: #8b949e;">Koi aur user nahi hai. Doosre tab mein naya account banayein test karne ke liye!</div>`;
            }
        });
    }

    // Go to Chat Room
    let active = null;
    function goChat(id, name) {
        active = id;
        document.getElementById('chatDashboard').style.display = 'none';
        document.getElementById('chatRoom').style.display = 'flex';
        document.getElementById('with').innerText = name;
        loadM();
    }

    // Load Messages
    function loadM() {
        const rid = auth.currentUser.uid < active ? auth.currentUser.uid+"_"+active : active+"_"+auth.currentUser.uid;
        db.collection('chats').doc(rid).collection('messages').orderBy('timestamp','asc').onSnapshot(s => {
            const a = document.getElementById('msgArea'); a.innerHTML = "";
            s.forEach(d => { 
                const m = d.data(); 
                a.innerHTML += `<div class="m ${m.sid===auth.currentUser.uid?'s':'r'}">${dec(m.txt)}</div>`; 
            });
            a.scrollTop = a.scrollHeight; // Auto-scroll to bottom
        });
    }

    // Send Message
    async function send() {
        const i = document.getElementById('mIn'); if(!i.value) return;
        const msgText = i.value;
        i.value = ""; // Input foran khali karein
        const rid = auth.currentUser.uid < active ? auth.currentUser.uid+"_"+active : active+"_"+auth.currentUser.uid;
        await db.collection('chats').doc(rid).collection('messages').add({ 
            txt: enc(msgText), 
            sid: auth.currentUser.uid, 
            timestamp: firebase.firestore.FieldValue.serverTimestamp() 
        });
    }

    function goDash() { 
        document.getElementById
