<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO | Mirza Shadab Baig</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --gold: #FFD700; --bg: #0a0e17; --panel: #141c2b; --txt: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--txt); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        #splash { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .q-logo { width: 110px; height: 110px; border: 3px solid var(--gold); border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: bold; color: var(--gold); box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); }
        #app { display: none; height: 100vh; flex-direction: column; }
        .header { background: var(--panel); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.2); }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: radial-gradient(circle at center, #0f1520 0%, var(--bg) 100%); }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; word-wrap: break-word; }
        .sent { align-self: flex-end; background: var(--gold); color: #000; font-weight: 500; border-bottom-right-radius: 4px; }
        .input-area { padding: 15px; background: var(--panel); display: flex; gap: 10px; align-items: center; }
        .input-box { flex: 1; background: #1c2638; border: 1px solid rgba(255,215,0,0.3); padding: 14px 20px; border-radius: 30px; color: white; outline: none; }
        .send-btn { background: var(--gold); border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; color: #000; font-weight: bold; }
        #admin { display: none; position: fixed; inset: 0; background: rgba(10, 14, 23, 0.95); backdrop-filter: blur(10px); z-index: 10000; padding: 30px; }
        .admin-box { background: var(--panel); border: 2px solid var(--gold); border-radius: 20px; padding: 30px; max-width: 400px; margin: 40px auto; text-align: center; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="q-logo">Q</div>
        <h1 style="color:var(--gold); margin-top:25px; letter-spacing:8px;">QUVRO</h1>
        <p style="color:#555; margin-top: 10px;">Mirza Shadab Baig Edition</p>
    </div>

    <div id="app">
        <div class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="q-logo" style="width:40px; height:40px; font-size:20px; border-width:2px; border-radius:10px;">Q</div>
                <div><b style="color:var(--gold);">QUVRO Network</b><br><small id="status" style="color:orange;">Connecting...</small></div>
            </div>
            </div>
        
        <div class="chat-area" id="box"></div>
        
        <div class="input-area">
            <input type="text" id="in" class="input-box" placeholder="Type a secure message...">
            <button onclick="sendMsg()" class="send-btn">➤</button>
        </div>
    </div>

    <div id="admin">
        <div class="admin-box">
            <h2 style="color:var(--gold); margin-bottom: 20px;">MASTER CONSOLE</h2>
            <p style="color:#fff; margin-bottom: 20px;">Owner: <span style="color:var(--gold)">Mirza Shadab Baig</span></p>
            <button onclick="clearChat()" style="background:#ff3333; color:white; padding:12px; border:none; width:100%; border-radius:8px; font-weight:bold; margin-bottom: 15px; cursor: pointer;">🚨 Nuclear Chat Wipe</button>
            <button onclick="document.getElementById('admin').style.display='none'" style="background:var(--gold); color:#000; padding:12px; border:none; width:100%; border-radius:8px; font-weight:bold; cursor: pointer;">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
            authDomain: "quvro-b3923.firebaseapp.com",
            projectId: "quvro-b3923",
            storageBucket: "quvro-b3923.firebasestorage.app",
            messagingSenderId: "46528123402",
            appId: "1:46528123402:web:9262edeb971f8f2b2405f3",
            databaseURL: "https://quvro-b3923-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref(".info/connected").on("value", (snap) => {
            const statusEl = document.getElementById('status');
            if(snap.val() === true) {
                statusEl.innerText = "● Online (Encrypted)";
                statusEl.style.color = "#00ffcc";
            } else {
                statusEl.innerText = "● Offline";
                statusEl.style.color = "#ff4444";
            }
        });

        setTimeout(() => { 
            document.getElementById('splash').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
        }, 2000);

        // KHUFIYA DARWAZA LOGIC
        function sendMsg() {
            let input = document.getElementById('in');
            let text = input.value.trim();

            // Check for secret password: "Aap"
            if(text === "Aap") {
                document.getElementById('admin').style.display = 'block';
                input.value = ""; 
                return; 
            }

            if(text !== ""){
                let msgId = Date.now();
                db.ref("quvro_chats/" + msgId).set({
                    text: text,
                    time: msgId
                });
                input.value = "";
            }
        }

        db.ref("quvro_chats").on("child_added", (data) => {
            let msg = data.val();
            let div = document.createElement('div');
            div.className = "msg sent"; 
            div.innerText = msg.text;
            document.getElementById('box').appendChild(div);
            document.getElementById('box').scrollTop = document.getElementById('box').scrollHeight;
        });

        function clearChat() {
            if(confirm("Confirm Nuclear Wipe?")) {
                db.ref("quvro_chats").remove();
                document.getElementById('box').innerHTML = "";
                document.getElementById('admin').style.display = 'none';
            }
        }
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
