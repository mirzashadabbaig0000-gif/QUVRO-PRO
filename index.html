<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO - Private Messenger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #111b21;
            height: 100vh;
            color: #e9edef;
            overflow: hidden;
        }

        #appContainer {
            width: 100%;
            height: 100vh;
            margin: 0 auto;
            background: #111b21;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .screen.active { display: flex; }

        /* Auth Screen */
        #authScreen { background: linear-gradient(145deg, #075e54, #054c44); }
        .auth-header { padding: 40px 20px 20px; text-align: center; color: white; }
        .auth-logo { width: 90px; height: 90px; background: rgba(255,255,255,0.15); border-radius: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 50px; }
        .auth-title { font-size: 36px; font-weight: bold; margin-bottom: 8px; }
        .auth-badges { display: flex; gap: 10px; justify-content: center; font-size: 13px; margin-top: 10px; }
        .auth-badges span { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; }
        
        .auth-form { background: #111b21; flex: 1; border-radius: 30px 30px 0 0; padding: 30px 20px; margin-top: 20px; }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group input { width: 100%; padding: 16px 16px 16px 45px; background: #2a3942; border: none; border-radius: 15px; color: white; font-size: 16px; outline: none; }
        .input-icon { position: absolute; left: 15px; top: 16px; font-size: 18px; }
