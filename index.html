<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root { --green: #075e54; --light: #25d366; --bg: #121b22; }
        body, html { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg); color: white; height: 100%; overflow: hidden; }
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .box { width: 85%; max-width: 350px; text-align: center; background: #1f2c34; padding: 30px; border-radius: 10px; }
        .logo { width: 60px; height: 60px; background: var(--green); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 30px; font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #2a3942; border: none; color: white; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { background: var(--light); color: #000; border: none; padding: 12px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        #chatDashboard, #chatRoom { display: none; height: 100vh; flex-direction: column; }
        .bar { background: #1f2c34; padding: 15px; font-weight: bold; border-bottom: 1px solid #2a3942; }
        .user { padding: 15px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
        #msgArea { flex: 1; overflow-y: auto; padding: 15px; background: #0b141a; display: flex; flex-direction: column; }
        .m { padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; max-width: 75%; }
        .s { background: #005c4b; align-self: flex-end; }
        .r { background: #202c33; align-self: flex-start; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="box">
        <div class="logo">Q</div>
        <h2>QUVRO</h2>
        <input type="text" id="n" placeholder="Name (Only for Sign Up)">
        <input type="email" id="e" placeholder="Email">
        <input type="password" id="p" placeholder="Password">
        
        <button onclick="login()">LOGIN</button>
        <button onclick="signUp()" style="background: #2a3942; color: white;">SIGN UP</button>
