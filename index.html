<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUVRO - Messaging App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .auth-container h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .auth-container p {
            color: #777;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #5e3b82;
        }
        .toggle-text {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        .toggle-text span {
            color: #764ba2;
            font-weight: bold;
            cursor: pointer;
        }
        #errorMsg {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>QUVRO</h1>
        <p id="subText">Create an account to start chatting</p>

        <div class="input-group" id="nameGroup">
            <input type="text" id="userName" placeholder="Full Name">
        </div>
        <div class="input-group">
            <input type="email" id="userEmail" placeholder="Email Address">
        </div>
        <div class="input-group">
            <input type="password" id="userPass" placeholder="Password (Min 6 chars)">
        </div>

        <button class="btn" id="actionBtn" onclick="handleAuth()">Sign Up</button>
        <p id="errorMsg"></p>

        <p class="toggle-text" id="toggleText">
            Already have an account? <span onclick="toggleMode()">Log In</span>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Aapki QUVRO Config
        const firebaseConfig = {
            apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
            authDomain: "quvro-b3923.firebaseapp.com",
            databaseURL: "https://quvro-b3923-default-rtdb.firebaseio.com",
            projectId: "quvro-b3923",
            storageBucket: "quvro-b3923.firebasestorage.app",
            messagingSenderId: "46528123402",
            appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isLoginMode = false; // Default Signup mode hai

        // UI Toggle logic (Signup se Login switch karne ke liye)
        function toggleMode() {
            isLoginMode = !isLoginMode;
            const nameGroup = document.getElementById('nameGroup');
            const actionBtn = document.getElementById('actionBtn');
            const toggleText = document.getElementById('toggleText');
            const subText = document.getElementById('subText');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none'; // Error hata do switch karne par

            if (isLoginMode) {
                nameGroup.style.display = 'none';
                actionBtn.innerText = 'Log In';
                subText.innerText = 'Welcome back! Log in to continue';
                toggleText.innerHTML = 'Don\'t have an account? <span onclick="toggleMode()">Sign Up</span>';
            } else {
                nameGroup.style.display = 'block';
                actionBtn.innerText = 'Sign Up';
                subText.innerText = 'Create an account to start chatting';
                toggleText.innerHTML = 'Already have an account? <span onclick="toggleMode()">Log In</span>';
            }
        }

        // Main Authentication Logic (Signup & Login)
        async function handleAuth() {
            const email = document.getElementById('userEmail').value.trim();
            const pass = document.getElementById('userPass').value;
            const name = document.getElementById('userName').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!email || !pass) {
                showError("Email and Password are required!");
                return;
            }

            try {
                if (isLoginMode) {
                    // Login
                    await auth.signInWithEmailAndPassword(email, pass);
                    alert("Login Successful! (Next step: Chat screen)");
                    // Yahan hum aage chal kar chat screen par bhejne ka code likhenge
                } else {
                    // Signup
                    if (!name) {
                        showError("Please enter your Full Name.");
                        return;
                    }
                    const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                    const user = userCredential.user;

                    // 🔴 SABSE ZAROORI STEP: Naye user ka data Firestore me save karna
                    // Taki ye aapke Master Console me dikhe!
                    await db.collection('users').doc(user.uid).set({
                        name: name,
                        email: email,
                        isBanned: false, // Default banned nahi hoga
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert("Account Created Successfully! Welcome to QUVRO.");
                    // Yahan hum chat screen par bhejne ka code likhenge
                }
            } catch (error) {
                showError(error.message);
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
