<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO - Next Generation Messenger</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <!-- Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --quvro-primary: #075e54;
            --quvro-secondary: #128C7E;
            --quvro-accent: #25D366;
            --quvro-dark: #111b21;
            --quvro-card: #1f2c34;
            --quvro-input: #2a3942;
            --quvro-text: #e9edef;
            --quvro-text-soft: #8696a0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--quvro-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        /* QUVRO Main Container */
        #quvroApp {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--quvro-dark);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* Screen Container */
        .quvro-screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: var(--quvro-dark);
        }

        .quvro-screen.active {
            display: flex;
        }

        /* ========== AUTH SCREEN ========== */
        #authScreen {
            background: linear-gradient(145deg, #075e54 0%, #064e45 100%);
        }

        .auth-header {
            padding: 40px 20px 30px;
            text-align: center;
            color: white;
        }

        .auth-logo {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.15);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 60px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .auth-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .auth-badge {
            display: flex;
            gap: 20px;
            justify-content: center;
            font-size: 14px;
            opacity: 0.9;
        }

        .auth-badge span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Auth Tabs */
        .auth-tabs {
            display: flex;
            background: var(--quvro-card);
            margin: 20px 20px 0;
            border-radius: 15px;
            padding: 5px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            font-weight: 600;
            color: var(--quvro-text-soft);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .auth-tab.active {
            background: var(--quvro-primary);
            color: white;
        }

        /* Auth Forms */
        .auth-form {
            flex: 1;
            padding: 20px;
            background: var(--quvro-dark);
            border-radius: 30px 30px 0 0;
            margin-top: 10px;
        }

        .input-field {
            margin-bottom: 20px;
        }

        .input-field label {
            display: block;
            color: var(--quvro-text-soft);
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--quvro-text-soft);
            font-size: 18px;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background: var(--quvro-input);
            border: 1px solid #3b4a54;
            border-radius: 15px;
            color: var(--quvro-text);
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--quvro-accent);
            background: #304550;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: var(--quvro-text-soft);
        }

        /* Phone Group */
        .phone-group {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 100px;
            padding: 16px;
            background: var(--quvro-input);
            border: 1px solid #3b4a54;
            border-radius: 15px;
            color: var(--quvro-text);
            font-size: 16px;
            outline: none;
        }

        /* Action Button */
        .quvro-btn {
            width: 100%;
            padding: 18px;
            background: var(--quvro-accent);
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            color: #111;
            cursor: pointer;
            margin: 25px 0 15px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .quvro-btn:active {
            transform: scale(0.97);
        }

        /* Links */
        .auth-links {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            color: var(--quvro-text-soft);
        }

        .auth-links a {
            color: var(--quvro-accent);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        /* QR Option */
        .qr-option {
            background: var(--quvro-card);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            cursor: pointer;
        }

        .qr-icon {
            width: 55px;
            height: 55px;
            background: var(--quvro-primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }

        .qr-text h4 {
            color: var(--quvro-text);
            margin-bottom: 5px;
        }

        .qr-text p {
            color: var(--quvro-text-soft);
            font-size: 13px;
        }

        /* Message Popup */
        #messagePopup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            background: var(--quvro-card);
            border-radius: 50px;
            color: white;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-left: 4px solid var(--quvro-accent);
        }

        /* Loading */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a3942;
            border-top-color: var(--quvro-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 400px) {
            .phone-group {
                flex-direction: column;
            }
            .country-code {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="quvroApp">
        <!-- Loading Overlay -->
        <div id="loadingOverlay">
            <div class="loading-spinner"></div>
        </div>

        <!-- Message Popup -->
        <div id="messagePopup">
            <i id="popupIcon" class="fas fa-check-circle" style="color: #25D366;"></i>
            <span id="popupText"></span>
        </div>

        <!-- AUTH SCREEN -->
        <div id="authScreen" class="quvro-screen active">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <div class="auth-title">QUVRO</div>
                <div class="auth-badge">
                    <span><i class="fas fa-shield-alt"></i> Secure</span>
                    <span><i class="fas fa-lock"></i> Private</span>
                    <span><i class="fas fa-bolt"></i> Fast</span>
                </div>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" id="loginTab" onclick="switchAuthTab('login')">
                    <i class="fas fa-sign-in-alt"></i> Login
                </div>
                <div class="auth-tab" id="registerTab" onclick="switchAuthTab('register')">
                    <i class="fas fa-user-plus"></i> Register
                </div>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm" class="auth-form">
                <div class="input-field">
                    <label><i class="fas fa-envelope"></i> Email or Phone</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="loginUsername" placeholder="Enter email or phone" value="demo@quvro.com">
                    </div>
                </div>

                <div class="input-field">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" id="loginPassword" placeholder="Enter password" value="123456">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('loginPassword', this)"></i>
                    </div>
                </div>

                <div class="auth-links">
                    <a onclick="forgotPassword()"><i class="fas fa-question-circle"></i> Forgot password?</a>
                    <a onclick="switchAuthTab('register')"><i class="fas fa-user-plus"></i> Create account</a>
                </div>

                <button class="quvro-btn" onclick="handleLogin()">
                    <span>Continue to QUVRO</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <!-- QR Option -->
                <div class="qr-option" onclick="showQR()">
                    <div class="qr-icon">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <div class="qr-text">
                        <h4>Connect with QR code</h4>
                        <p>Scan to login on other devices</p>
                    </div>
                </div>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <div class="input-field">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user-circle"></i>
                        <input type="text" id="registerName" placeholder="Your name">
                    </div>
                </div>

                <div class="input-field">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <div class="phone-group">
                        <select class="country-code" id="countryCode">
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+92">🇵🇰 +92</option>
                            <option value="+971">🇦🇪 +971</option>
                        </select>
                        <div class="input-wrapper" style="flex:1;">
                            <i class="fas fa-phone-alt"></i>
                            <input type="tel" id="registerPhone" placeholder="Phone number">
                        </div>
                    </div>
                </div>

                <div class="input-field">
                    <label><i class="fas fa-envelope"></i> Email (Optional)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="registerEmail" placeholder="your@email.com">
                    </div>
                </div>

                <div class="input-field">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" id="registerPassword" placeholder="Create password">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('registerPassword', this)"></i>
                    </div>
                </div>

                <div style="color: var(--quvro-text-soft); font-size: 12px; text-align: center; margin: 15px 0;">
                    By signing up, you agree to our Terms and Privacy Policy
                </div>

                <button class="quvro-btn" onclick="handleRegister()">
                    <span>Create QUVRO Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>

                <div style="text-align: center; margin-top: 15px;">
                    <a onclick="switchAuthTab('login')" style="color: var(--quvro-accent); cursor: pointer;">
                        <i class="fas fa-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>

        <!-- CHAT SCREEN (Will be shown after login) -->
        <div id="chatScreen" class="quvro-screen">
            <!-- Chat UI will go here -->
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
            authDomain: "quvro-b3923.firebaseapp.com",
            projectId: "quvro-b3923",
            storageBucket: "quvro-b3923.firebasestorage.app",
            messagingSenderId: "46528123402",
            appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ========== UI FUNCTIONS ==========
        function showMessage(text, type) {
            const popup = document.getElementById('messagePopup');
            const popupText = document.getElementById('popupText');
            const popupIcon = document.getElementById('popupIcon');
            
            popupText.innerText = text;
            
            if(type === 'success') {
                popupIcon.className = 'fas fa-check-circle';
                popupIcon.style.color = '#25D366';
            } else {
                popupIcon.className = 'fas fa-exclamation-circle';
                popupIcon.style.color = '#f44336';
            }
            
            popup.style.display = 'flex';
            
            setTimeout(() => {
                popup.style.display = 'none';
            }, 3000);
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function togglePassword(inputId, element) {
            const input = document.getElementById(inputId);
            if(input.type === 'password') {
                input.type = 'text';
                element.classList.remove('fa-eye');
                element.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                element.classList.remove('fa-eye-slash');
                element.classList.add('fa-eye');
            }
        }

        // ========== AUTH FUNCTIONS ==========
        function switchAuthTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if(tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if(!username || !password) {
                showMessage('Please enter all fields!', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                // Check if username is email or phone
                const isEmail = username.includes('@');
                
                if(isEmail) {
                    // Login with email
                    await auth.signInWithEmailAndPassword(username, password);
                } else {
                    // Login with phone - you'll need to implement phone auth
                    showMessage('Phone login coming soon!', 'success');
                    showLoading(false);
                    return;
                }
                
                showMessage('Login successful!', 'success');
                
                setTimeout(() => {
                    // Redirect to chat
                    document.getElementById('authScreen').classList.remove('active');
                    document.getElementById('chatScreen').classList.add('active');
                }, 1000);
                
            } catch(error) {
                showMessage(error.message, 'error');
            } finally {
                showLoading(false);
            }
        }
