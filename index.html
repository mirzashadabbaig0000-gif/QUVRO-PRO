<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --whatsapp-green: #075e54; --light-green: #25d366; --dark-bg: #121b22; --chat-bg: #0b141a; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark-bg); color: white; height: 100%; overflow: hidden; }
        
        /* Auth Screen */
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: var(--dark-bg); }
        .auth-container { width: 85%; max-width: 350px; text-align: center; }
        .logo-circle { width: 80px; height: 80px; background: var(--whatsapp-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 30px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        /* Chat UI */
        #chatDashboard, #chatRoom { display: none; height: 100vh; flex-direction: column; }
        .app-bar { background: var(--whatsapp-green); padding: 15px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .user-list-item { padding: 15px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .user-list-item:active { background: #1d272e; }
        .avatar { width: 45px; height: 45px; background: #3d464d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Message Styles */
        #messageArea { flex: 1; overflow-y: auto; padding: 15px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: var(--chat-bg); background-blend-mode: overlay; display: flex; flex-direction: column; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; font-size: 15px; position: relative; }
        .sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2a3942; border: none; color: white; border-radius: 8px; outline: none; }
        .btn-main { background: var(--light-green); color: #000; border: none; padding: 12px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; }
        .input-bar { background: #202c33; padding: 10px; display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="auth-container">
        <div class="logo-circle">Q</div>
        <h2 style="margin:0;">QUVRO</h2>
        <p style="color:#8696a0; font-size:14px; margin-bottom:30px;">End-to-end encrypted</p>
        <input type="text" id="regName" placeholder="Enter your name">
        <input type="email" id="userEmail" placeholder="Email address">
        <input type="password" id="userPass" placeholder="Password">
        <button class="btn-main" onclick="handleAuth()">AGREE AND CONTINUE</button>
    </div>
</div>

<div id="chatDashboard">
    <div class="app-bar"><strong>QUVRO</strong></div>
    <div id="usersList" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="chatRoom">
    <div class="app-bar">
        <span onclick="showDashboard()" style="cursor:pointer; font-size:20px;">⬅</span>
        <div class="avatar" id="roomAvatar">?</div>
        <div style="flex:1"><strong id="chattingWith">Chat</strong><br><small style="font-size:10px; color:#cfd8dc;">online</small></div>
    </div>
    <div id="messageArea"></div>
    <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Message" style="margin:0;">
        <button onclick="sendMsg()" style="background:var(--light-green); border:none; width:45px; height:45px; border-radius:50%;">➤</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        databaseURL: "https://quvro-b3923-default-rtdb.firebaseio.com",
        projectId: "quvro-b3923",
        storageBucket: "quvro-b3923.firebasestorage.app",
        messagingSenderId: "46528123402",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const S_KEY = "Quvro_Ultra_Secure_Baig_786";

    let currentUser = null, activeChatId = null;

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            showDashboard();
            loadUsers();
        } else {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('chatDashboard').style.display = 'none';
            document.getElementById('chatRoom').style.display = 'none';
        }
    });

    function encrypt(t) { return CryptoJS.AES.encrypt(t, S_KEY).toString(); }
    function decrypt(c) { try { return CryptoJS.AES.decrypt(c, S_KEY).toString(CryptoJS.enc.Utf8); } catch(e){return "---";} }

    async function handleAuth() {
        const e = document.getElementById('userEmail').value, p = document.getElementById('userPass').value, n = document.getElementById('regName').value;
        if(!e || !p) return alert("Fill all fields");
        auth.signInWithEmailAndPassword(e, p).catch(() => {
            auth.createUserWithEmailAndPassword(e, p).then(r => {
                db.collection('users').doc(r.user.uid).set({ name: n, email: e });
            });
        });
    }

    function loadUsers() {
        db.collection('users').onSnapshot(s => {
            const l = document.getElementById('usersList'); l.innerHTML = "";
            s.forEach(d => { 
                if(d.id !== currentUser.uid) {
                    const name = d.data().name;
                    l.innerHTML += `<div class="user-list-item" onclick="openChat('${d.id}','${name}')">
                        <div class="avatar">${name[0].toUpperCase()}</div>
                        <div><strong>${name}</strong><br><small style="color:#8696a0;">Tap to secure chat</small></div>
                    </div>`;
                }
            });
        });
    }

    function openChat(id, name) {
        activeChatId = id;
        document.getElementById('chatDashboard').style.display = 'none';
        document.getElementById('chatRoom').style.display = 'flex';
        document.getElementById('chattingWith').innerText = name;
        document.getElementById('roomAvatar').innerText = name[0].toUpperCase();
        loadMsgs();
    }

    function loadMsgs() {
        const rid = currentUser.uid < activeChatId ? currentUser.uid+"_"+activeChatId : activeChatId+"_"+currentUser.uid;
        db.collection('chats').doc(rid).collection('messages').orderBy('timestamp','asc').onSnapshot(s => {
            const a = document.getElementById('messageArea'); a.innerHTML = "";
            s.forEach(d => {
                const m = d.data();
                a.innerHTML += `<div class="msg ${m.sid===currentUser.uid?'sent':'received'}">${decrypt(m.txt)}</div>`;
            });
            a.scrollTop = a.scrollHeight;
        });
    }

    async function sendMsg() {
        const i = document.getElementById('msgInput'); if(!i.value) return;
        const rid = currentUser.uid < activeChatId ? currentUser.uid+"_"+activeChatId : activeChatId+"_"+currentUser.uid;
        await db.collection('chats').doc(rid).collection('messages').add({ txt: encrypt(i.value), sid: currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        i.value = "";
    }

    function showDashboard() { document.getElementById('authScreen').style.display='none'; document.getElementById('chatDashboard').style.display='flex'; document.getElementById('chatRoom').style.display='none'; }
</script>
</body>
</html>
