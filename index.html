<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --green: #075e54; --light: #25d366; --bg: #121b22; --panel: #1f2c34; }
        body, html { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg); color: white; height: 100%; overflow: hidden; }
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .box { width: 85%; max-width: 350px; text-align: center; background: var(--panel); padding: 30px; border-radius: 15px; border: 1px solid #2a3942; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #2a3942; border: none; color: white; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { background: var(--light); color: #000; border: none; padding: 12px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        #mainContainer, #chatRoom { display: none; height: 100vh; flex-direction: column; }
        .bar { background: var(--panel); padding: 15px; font-weight: bold; border-bottom: 1px solid #2a3942; display: flex; justify-content: space-between; align-items: center; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--panel); border-top: 1px solid #2a3942; }
        .nav-item { flex: 1; padding: 15px; text-align: center; font-size: 12px; font-weight: bold; color: #8696a0; cursor: pointer; }
        .nav-active { color: var(--light); border-top: 3px solid var(--light); }
        #msgArea { flex: 1; overflow-y: auto; padding: 15px; background: #0b141a; display: flex; flex-direction: column; }
        .m { padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; max-width: 75%; font-size: 14px; word-wrap: break-word; }
        .s { background: #005c4b; align-self: flex-end; }
        .r { background: #202c33; align-self: flex-start; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="box">
        <h2 style="color: var(--light);">QUVRO PRO</h2>
        <div id="loginStep">
            <input type="text" id="uName" placeholder="Enter Name">
            <input type="text" id="uPhone" placeholder="Mobile with +91">
            <div id="recaptcha-container" style="margin:10px 0; display: flex; justify-content: center;"></div>
            <button onclick="sendOTP()">OTP BHEJEIN</button>
        </div>
        <div id="otpStep" style="display:none;">
            <input type="text" id="uOTP" placeholder="Enter 6-Digit OTP">
            <button onclick="verifyOTP()">VERIFY & LOGIN</button>
        </div>
    </div>
</div>

<div id="mainContainer">
    <div id="tab-chats" style="display: flex; flex-direction: column; height: 100%;">
        <div class="bar">QUVRO PRO <small onclick="auth.signOut()" style="color:red;">Logout</small></div>
        <div style="padding:10px; display: flex; gap: 5px;">
            <input type="text" id="searchPh" placeholder="Search Number (+91...)" style="margin:0;">
            <button onclick="searchUser()" style="width: 80px; margin:0;">FIND</button>
        </div>
        <div id="uList" style="flex:1; overflow-y:auto;"></div>
    </div>
    
    <div class="nav-bar">
        <div class="nav-item nav-active">CHATS</div>
        <div class="nav-item" onclick="alert('Status feature coming soon!')">STATUS</div>
        <div class="nav-item" onclick="alert('Call feature coming soon!')">CALLS</div>
    </div>
</div>

<div id="chatRoom">
    <div class="bar"><span onclick="closeChat()" style="cursor:pointer;">⬅</span> <span id="chatTitle">Chat</span></div>
    <div id="msgArea"></div>
    <div style="padding:10px; background:var(--panel); display:flex; gap:5px;">
        <input type="text" id="mInput" placeholder="Message..." style="margin:0;">
        <button onclick="sendMsg()" style="width:50px; margin:0;">></button>
    </div>
</div>

<script>
    const cfg = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        projectId: "quvro-b3923",
        storageBucket: "quvro-b3923.firebasestorage.app",
        messagingSenderId: "46528123402",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };
    firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const KEY = "Quvro_Secure_Baig_786";

    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'normal' });

    auth.onAuthStateChanged(u => {
        if(u) {
            document.getElementById('authScreen').style.display='none';
            document.getElementById('mainContainer').style.display='flex';
        } else {
            document.getElementById('authScreen').style.display='flex';
            document.getElementById('mainContainer').style.display='none';
        }
    });

    let confirmation;
    function sendOTP() {
        let ph = document.getElementById('uPhone').value.trim();
        if(!ph.startsWith('+')) ph = '+91' + ph; // Auto-add India code if missing
        
        auth.signInWithPhoneNumber(ph, window.recaptchaVerifier).then(res => {
            confirmation = res;
            document.getElementById('loginStep').style.display='none';
            document.getElementById('otpStep').style.display='block';
        }).catch(e => alert("Error: " + e.message));
    }

    function verifyOTP() {
        const code = document.getElementById('uOTP').value;
        const name = document.getElementById('uName').value;
        const ph = document.getElementById('uPhone').value.startsWith('+') ? document.getElementById('uPhone').value : '+91'+document.getElementById('uPhone').value;

        confirmation.confirm(code).then(res => {
            db.collection('users').doc(res.user.uid).set({ name: name, phone: ph });
        }).catch(e => alert("Galat OTP!"));
    }

    async function searchUser() {
        let ph = document.getElementById('searchPh').value.trim();
        if(!ph.startsWith('+')) ph = '+91' + ph;

        const snap = await db.collection('users').where("phone", "==", ph).get();
        const list = document.getElementById('uList'); list.innerHTML = "";
        if(snap.empty) return alert("User nahi mila! Kya unhone app register ki hai?");
        snap.forEach(d => {
            list.innerHTML += `<div style="padding:15px; border-bottom:1px solid #222; background:#1f2c34; margin:5px; border-radius:10px;" onclick="openChat('${d.id}','${d.data().name}')"><strong>${d.data().name}</strong><br><small>${d.data().phone}</small></div>`;
        });
    }

    let activeID = null;
    function openChat(id, name) {
        activeID = id;
        document.getElementById('chatTitle').innerText = name;
        document.getElementById('mainContainer').style.display = 'none';
        document.getElementById('chatRoom').style.display = 'flex';
        loadChat();
    }
    function closeChat() { 
        document.getElementById('chatRoom').style.display = 'none'; 
        document.getElementById('mainContainer').style.display = 'flex';
    }

    function enc(t) { return CryptoJS.AES.encrypt(t, KEY).toString(); }
    function dec(c) { try { return CryptoJS.AES.decrypt(c, KEY).toString(CryptoJS.enc.Utf8); } catch(e){return "Message Error";} }

    function loadChat() {
        const rid = auth.currentUser.uid < activeID ? auth.currentUser.uid+"_"+activeID : activeID+"_"+auth.currentUser.uid;
        db.collection('chats').doc(rid).collection('messages').orderBy('timestamp','asc').onSnapshot(s => {
            const area = document.getElementById('msgArea'); area.innerHTML = "";
            s.forEach(d => {
                const m = d.data();
                area.innerHTML += `<div class="m ${m.sid===auth.currentUser.uid?'s':'r'}">${dec(m.txt)}</div>`;
            });
            area.scrollTop = area.scrollHeight;
        });
    }

    async function sendMsg() {
        const val = document.getElementById('mInput').value; if(!val) return;
        const rid = auth.currentUser.uid < activeID ? auth.currentUser.uid+"_"+activeID : activeID+"_"+auth.currentUser.uid;
        await db.collection('chats').doc(rid).collection('messages').add({ txt: enc(val), sid: auth.currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('mInput').value = "";
    }
</script>
</body>
</html>
