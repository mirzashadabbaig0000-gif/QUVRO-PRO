<style>
    .nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; background: #1f2c34; border-top: 1px solid #2a3942; }
    .nav-item { flex: 1; padding: 15px; text-align: center; font-size: 14px; font-weight: bold; cursor: pointer; }
    .active { border-top: 3px solid var(--light); color: var(--light); }
    
    /* Screen hide/show logic */
    #statusScreen, #callScreen { display: none; height: 100vh; background: var(--bg); }
</style>

<div id="statusScreen">
    <div class="bar">Status</div>
    <div style="padding: 20px; text-align: center;">
        <button onclick="askCamera()">Add Story (+)</button>
    </div>
</div>

<div id="callScreen">
    <div class="bar">Calls</div>
    <div style="padding: 20px; text-align: center;">No recent calls.</div>
</div>

<div class="nav-bar">
    <div class="nav-item active" onclick="showTab('chats')">CHATS</div>
    <div class="nav-item" onclick="showTab('status')">STATUS</div>
    <div class="nav-item" onclick="showTab('calls')">CALLS</div>
</div>

<script>
    // Tab badalne ka logic
    function showTab(tab) {
        document.getElementById('chatDashboard').style.display = tab === 'chats' ? 'flex' : 'none';
        document.getElementById('statusScreen').style.display = tab === 'status' ? 'block' : 'none';
        document.getElementById('callScreen').style.display = tab === 'calls' ? 'block' : 'none';
        
        // Active class change karein
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    // Camera Permission mangne ka function
    async function askCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            alert("Camera Permission Granted!");
            // Ab yahan se camera chalu ho sakta hai
        } catch (err) {
            alert("Permission Denied! Bina allow kiye aap story nahi dal sakte.");
        }
    }
</script>
