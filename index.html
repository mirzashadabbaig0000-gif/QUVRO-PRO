<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUVRO PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body { background: #121b22; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #1f2c34; padding: 20px; border-radius: 10px; display: inline-block; width: 80%; max-width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #25d366; color: black; padding: 10px; width: 95%; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #recaptcha-container { margin: 15px 0; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="box">
        <h2>QUVRO PRO</h2>
        <div id="login-div">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="phone" placeholder="+91 0000000000">
            <div id="recaptcha-container"></div>
            <button onclick="sendOTP()">SEND OTP</button>
        </div>
        <div id="otp-div" style="display:none;">
            <input type="text" id="otp" placeholder="Enter OTP">
            <button onclick="verifyOTP()">VERIFY</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        projectId: "quvro-b3923",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    
    // recaptcha set up
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container');

    let coderesult;
    function sendOTP() {
        const ph = document.getElementById('phone').value;
        auth.signInWithPhoneNumber(ph, window.recaptchaVerifier).then(res => {
            coderesult = res;
            document.getElementById('login-div').style.display = 'none';
            document.getElementById('otp-div').style.display = 'block';
        }).catch(err => alert("Firebase Error: " + err.message));
    }

    function verifyOTP() {
        const code = document.getElementById('otp').value;
        coderesult.confirm(code).then(() => {
            alert("Login Successful!");
        }).catch(() => alert("Galat OTP!"));
    }
</script>
</body>
</html>
