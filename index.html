<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUVRO - Secure Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --green: #075e54; --light: #25d366; --bg: #121b22; }
        body, html { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg); color: white; height: 100%; overflow: hidden; }
        #authScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .box { width: 85%; max-width: 350px; text-align: center; background: #1f2c34; padding: 30px; border-radius: 10px; }
        .logo { width: 60px; height: 60px; background: var(--green); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 30px; font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #2a3942; border: none; color: white; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { background: var(--light); color: #000; border: none; padding: 12px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        #chatDashboard, #chatRoom { display: none; height: 100vh; flex-direction: column; }
        .bar { background: #1f2c34; padding: 15px; font-weight: bold; border-bottom: 1px solid #2a3942; display: flex; justify-content: space-between; align-items: center; }
        .user { padding: 15px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; background: #1f2c34; margin: 5px; border-radius: 8px; }
        #msgArea { flex: 1; overflow-y: auto; padding: 15px; background: #0b141a; display: flex; flex-direction: column; }
        .m { padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; max-width: 75%; }
        .s { background: #005c4b; align-self: flex-end; }
        .r { background: #202c33; align-self: flex-start; }
        #recaptcha-container { margin-top: 10px; }

        /* Anti-Ad CSS */
        iframe, .appsgeyser-ad, [class*="appsgeyser"] { display: none !important; height: 0 !important; visibility: hidden !important; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="box">
        <div class="logo">Q</div>
        <h2>QUVRO</h2>
        <div id="loginStep1">
            <input type="text" id="userName" placeholder="Your Name">
            <input type="text" id="phoneNum" placeholder="+91 0000000000">
            <div id="recaptcha-container"></div>
            <button onclick="sendOTP()">SEND OTP</button>
        </div>
        <div id="loginStep2" style="display:none;">
            <input type="text" id="otpCode" placeholder="6-Digit OTP">
            <button onclick="verifyOTP()">VERIFY & JOIN</button>
        </div>
    </div>
</div>

<div id="chatDashboard">
    <div class="bar">
        <span>QUVRO</span>
        <button onclick="auth.signOut()" style="width:auto; padding:5px 10px; margin:0; font-size:12px;">LOGOUT</button>
    </div>
    <div style="padding:10px;">
        <input type="text" id="searchPh" placeholder="Search Mobile Number..." style="margin:0;">
        <button onclick="searchUser()" style="margin-top:5px;">SEARCH CONTACT</button>
    </div>
    <div id="uList" style="flex:1; overflow-y:auto;"></div>
</div>

<div id="chatRoom">
    <div class="bar"><span onclick="goDash()" style="cursor:pointer">⬅</span> <span id="with">Chat</span></div>
    <div id="msgArea"></div>
    <div style="background:#1f2c34; padding:10px; display:flex; gap:5px;">
        <input type="text" id="mIn" placeholder="Message" style="margin:0;">
        <button onclick="send()" style="width:50px; margin:0;">></button>
    </div>
</div>

<script>
    const cfg = {
        apiKey: "AIzaSyDZUuVUkkzoR3xnMw08fowuPFhP36RlPrg",
        authDomain: "quvro-b3923.firebaseapp.com",
        projectId: "quvro-b3923",
        storageBucket: "quvro-b3923.firebasestorage.app",
        messagingSenderId: "46528123402",
        appId: "1:46528123402:web:9262edeb971f8f2b2405f3"
    };
    firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const KEY = "Quvro_Ultra_Secure_Baig_786";

    let confirmationResult;
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });

    auth.onAuthStateChanged(u => {
        if (u) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatDashboard').style.display = 'flex';
        } else {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('chatDashboard').style.display = 'none';
        }
    });

    async function sendOTP() {
        const ph = document.getElementById('phoneNum').value;
        const name = document.getElementById('userName').value;
        if(!ph || !name) return alert("Please enter Name and Phone (+91...)");
        
        auth.signInWithPhoneNumber(ph, window.recaptchaVerifier).then(res => {
            confirmationResult = res;
            document.getElementById('loginStep1').style.display = 'none';
            document.getElementById('loginStep2').style.display = 'block';
        }).catch(err => alert(err.message));
    }

    async function verifyOTP() {
        const code = document.getElementById('otpCode').value;
        const name = document.getElementById('userName').value;
        const ph = document.getElementById('phoneNum').value;

        confirmationResult.confirm(code).then(res => {
            db.collection('users').doc(res.user.uid).set({ name: name, phone: ph });
        }).catch(err => alert("Wrong OTP!"));
    }

    async function searchUser() {
        const ph = document.getElementById('searchPh').value;
        const s = await db.collection('users').where("phone", "==", ph).get();
        const l = document.getElementById('uList'); l.innerHTML = "";
        if(s.empty) return alert("User not found!");
        s.forEach(d => {
            l.innerHTML += `<div class="user" onclick="goChat('${d.id}','${d.data().name}')"><strong>${d.data().name}</strong><br><small>${d.data().phone}</small></div>`;
        });
    }

    function enc(t) { return CryptoJS.AES.encrypt(t, KEY).toString(); }
    function dec(c) { try { return CryptoJS.AES.decrypt(c, KEY).toString(CryptoJS.enc.Utf8); } catch(e){return "---";} }

    let active = null;
    function goChat(id, name) {
        active = id;
        document.getElementById('chatDashboard').style.display = 'none';
        document.getElementById('chatRoom').style.display = 'flex';
        document.getElementById('with').innerText = name;
        loadM();
    }

    function loadM() {
        const rid = auth.currentUser.uid < active ? auth.currentUser.uid+"_"+active : active+"_"+auth.currentUser.uid;
        db.collection('chats').doc(rid).collection('messages').orderBy('timestamp','asc').onSnapshot(s => {
            const a = document.getElementById('msgArea'); a.innerHTML = "";
            s.forEach(d => { const m = d.data(); a.innerHTML += `<div class="m ${m.sid===auth.currentUser.uid?'s':'r'}">${dec(m.txt)}</div>`; });
            a.scrollTop = a.scrollHeight;
        });
    }

    async function send() {
        const i = document.getElementById('mIn'); if(!i.value) return;
        const rid = auth.currentUser.uid < active ? auth.currentUser.uid+"_"+active : active+"_"+auth.currentUser.uid;
        await db.collection('chats').doc(rid).collection('messages').add({ txt: enc(i.value), sid: auth.currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        i.value = "";
    }

    function goDash() { document.getElementById('chatDashboard').style.display='flex'; document.getElementById('chatRoom').style.display='none'; }
    
    setInterval(() => { document.querySelectorAll('iframe').forEach(el => el.remove()); }, 2000);
</script>
</body>
</html>
